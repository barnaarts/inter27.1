<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interdisciplinary January&#39;27</title>
<meta name="application-name" content="INTER">
<meta name="apple-mobile-web-app-title" content="INTER">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C5DAE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E2A2E" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1b1b1b; --muted:#6b6862; --line:#e4e0d8;
    --accent:#ff3438; --accent-soft:#fbe9e5;
    --c-studio:#2f6fdb; --c-guest:#c2398a; --c-outing:#e07b1a; --c-perf:#7b4bd1;
    --c-talk:#b38a00; --c-show:#ff3438; --c-social:#2e8b57; --c-free:#8a8780; --c-creation:#0f8b8d; --c-travel:#4b5563;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141413; --card:#1f1f1d; --ink:#f2f0ea; --muted:#a19e96; --line:#33322f; --accent-soft:#3a1f19; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0;max-width:640px;margin:0 auto}
  .brand{font-weight:700;letter-spacing:.06em;font-size:13px}
  .brand span{color:#fff;opacity:.75}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid rgba(255,255,255,.6);background:none;color:#fff;font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
  .tab.on{background:#fff;color:var(--accent);border-color:#fff;font-weight:700}
  .days{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;max-width:640px;margin:0 auto;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .daysep{flex:0 0 2px;align-self:stretch;margin:4px 2px;background:rgba(255,255,255,.55);border-radius:2px}
  .day.out{cursor:pointer}
  header.nodays .top{padding-bottom:12px}
  .day{flex:0 0 auto;border:1px solid transparent;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;font:inherit;min-width:52px}
  .day small{display:block;font-size:11px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.05em}
  .day b{font-size:17px}
  .day.on{border:2px solid #fff;padding:5px 9px;box-shadow:inset 0 0 12px 3px rgba(255,255,255,.75)}
  .day.today{border:2px solid #ffd84a;padding:5px 9px;animation:todayPulse 2.4s ease-in-out infinite}
  @keyframes todayPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,60,0)}50%{box-shadow:0 0 14px 5px rgba(255,210,60,1)}}
  .day.ext small{color:#fff}
  main{max-width:640px;margin:0 auto;padding:14px 16px 60px}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--c,var(--c-free))}
  .ev.hit,.artist.hit{animation:hit 6s ease-in-out 1}
  @keyframes hit{0%,100%{box-shadow:0 0 0 0 rgba(123,75,209,0)}17%{box-shadow:0 0 22px 8px rgba(123,75,209,.7)}}
  .ev.now{outline:2px solid var(--accent)}
  .time{flex:0 0 64px;font-weight:700;font-size:15px;line-height:1.25}
  .time small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  .body{flex:1;min-width:0}
  .title{font-weight:700;font-size:16px;line-height:1.3}
  .who{font-size:14px;color:var(--muted);margin-top:2px}
  .where{font-size:14px;margin-top:6px}
  .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--muted)}
  .tag.tbc{background:#fff4d6;color:#8a6200}
  .tag.opt{background:#e6f4ec;color:#1f6b42}
  .tag.ext{background:#e3ecfb;color:#1f4fa6}
  .tag.now{background:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.tbc{background:#3a3016;color:#f0c75e} .tag.opt{background:#17301f;color:#7fd3a1} .tag.ext{background:#192640;color:#8fb3f2} }
  .map{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:4px 11px}
  :root{--link:#7b4bd1;--link-soft:#ffffff}
  @media (prefers-color-scheme: dark){ :root{--link:#b49bf2;--link-soft:var(--card)} }
  .alink{display:inline-block;margin:8px 6px 0 0;font-size:13px;font-weight:700;color:var(--link);background:var(--link-soft);text-decoration:none;border:1px solid var(--link);border-radius:999px;padding:4px 11px}
  .fold{margin:22px 0 10px}
  .fold summary{list-style:none;cursor:pointer;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary::after{content:"▾";color:var(--link,#7b4bd1);font-size:18px;transition:transform .25s}
  .fold[open] summary::after{transform:rotate(180deg)}
  .fold[open] summary{border-radius:14px 14px 0 0;border-bottom:none;margin-bottom:0}
  .fold[open] .card{border-radius:0 0 14px 14px;border-top:none;padding-top:4px;animation:unfold .25s ease}
  @keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .slide-l{animation:slideL .25s ease}
  .slide-r{animation:slideR .25s ease}
  @keyframes slideL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
  .lunch{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:4px 2px 14px}
  .lunch::before,.lunch::after{content:"";flex:1;border-top:1px dashed var(--line)}
  .ov{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
  .ov.we{border-left:4px solid var(--we-ink)}
  .note.ovglow{border:1px solid #f5c518;box-shadow:0 0 14px 4px rgba(240,190,30,.85)}
  .artist.now,.venue.now{border-color:#f5c518;box-shadow:0 0 14px 4px rgba(240,190,30,.85);position:relative}
  .todaytag{position:absolute;top:10px;right:10px;z-index:2}
  .ov.today{border-color:#f5c518;box-shadow:0 0 14px 4px rgba(240,190,30,.85)}
  .ovd{display:block;font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;margin-bottom:4px}
  .ovr{display:flex;gap:10px;font-size:14px;color:var(--ink);text-decoration:none;padding:3px 0;border-top:1px solid var(--line)}
  .ovr small{color:var(--muted)}
  .ovt{flex:0 0 72px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .cdbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:6px 0 14px;text-align:center}
  .cdbox{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .flicker{position:fixed;inset:0;z-index:40;pointer-events:none;background:rgba(10,8,6,.86);animation:dimIn .35s ease both}
  @keyframes dimIn{from{opacity:0}to{opacity:1}}
  .cdbox.lit{box-shadow:0 0 40px 6px rgba(212,175,55,.45);transition:box-shadow .35s ease}
  .cdhint{margin-top:10px;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .cdl{font-weight:700;font-size:15px;margin-bottom:12px}
  .cdg{display:flex;justify-content:center;align-items:flex-start;gap:6px}
  .cdu.cdays{margin-right:14px}
  .colon{font-family:"Oswald","Arial Narrow",sans-serif;font-size:30px;font-weight:500;line-height:40px;padding-top:6px;color:#b8922a;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  .cdg small{color:var(--muted);font-size:12px}
  #totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:7;display:block;opacity:0;transform:translateY(70px);pointer-events:none;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s ease;font:inherit;font-size:13px;font-weight:700;color:#fff;background:rgba(123,75,209,.5);border:1px solid #fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #totop.show{opacity:1;transform:none;pointer-events:auto}
  #totop.show:active{transform:scale(.92)}
  /* fun bits */
  .cdu{padding:6px 0 0}
  .flaps{display:flex;justify-content:center;gap:3px;margin-bottom:6px;perspective:300px}
  .flap{position:relative;display:inline-block;width:26px;height:40px;font-family:"Oswald","Arial Narrow",sans-serif;font-weight:500;font-size:30px;color:#1b1b1b;border-radius:4px;box-shadow:0 2px 3px rgba(0,0,0,.3);perspective:160px;font-variant-numeric:tabular-nums}
  .flap .h{position:absolute;left:0;right:0;height:50%;overflow:hidden}
  .flap .h span{position:absolute;left:0;right:0;height:40px;line-height:40px;text-align:center}
  .flap .t{top:0;border-radius:4px 4px 0 0;background:linear-gradient(#e9cb6b,#dcb94f)}
  .flap .b{bottom:0;border-radius:0 0 4px 4px;background:linear-gradient(#cfa83a,#c39b2e)}
  .flap .t span{top:0}
  .flap .b span{bottom:0}
  .flap .ft{z-index:2;transform-origin:bottom;animation:foldTop .22s ease-in forwards;backface-visibility:hidden}
  .flap .fb{z-index:2;transform-origin:top;transform:rotateX(90deg);animation:foldBot .22s .22s ease-out forwards;backface-visibility:hidden}
  @keyframes foldTop{to{transform:rotateX(-90deg);filter:brightness(.7)}}
  @keyframes foldBot{from{transform:rotateX(90deg);filter:brightness(1.2)}to{transform:rotateX(0);filter:none}}
  .flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45);z-index:3}
  @media (prefers-color-scheme: dark){ .flap{box-shadow:0 2px 4px rgba(0,0,0,.6)} }
  .flip{animation:flip .45s ease}
  @keyframes flip{0%{transform:rotateX(90deg);opacity:.2}100%{transform:rotateX(0);opacity:1}}
  .confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
  .tearface{position:fixed;font-size:30px;z-index:51;pointer-events:none;animation:tearface 3.2s ease forwards}
  @keyframes tearface{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.1)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
  #main{overflow-x:clip;min-height:100vh}
  .ev.opt{background:transparent;border:1.5px dashed var(--c,var(--c-free));box-shadow:none}
  .reveal{opacity:0;transform:translateY(18px)}
  .reveal.in{animation:rise .5s ease both;animation-delay:var(--d,0ms)}
  .artist.reveal.in,.venue.reveal.in,.info .reveal.in{animation:riseFade 1s cubic-bezier(.25,.6,.3,1) both;animation-delay:var(--d,0ms)}
  @keyframes riseFade{0%{opacity:0;transform:translateY(36px) scale(.98)}100%{opacity:1;transform:none}}
  .reveal-x{opacity:0;transform:translateX(28px)}
  .reveal-x.in{animation:slideIn .45s ease both;animation-delay:var(--d,0ms)}
  @keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  .reveal.hit,.reveal.in.hit{opacity:1;transform:none;animation:hit 6s ease-in-out 1}
  .big.sos{animation:sos 1.4s ease 1}
  @keyframes sos{0%{text-shadow:none;transform:scale(1)}30%{text-shadow:0 0 18px rgba(255,52,56,.9);transform:scale(1.15)}100%{text-shadow:none;transform:scale(1)}}
  .info .big{display:block;width:fit-content;margin-bottom:8px;transform-origin:left center}
  .ev.rise.hit{animation:hit 6s ease-in-out 1}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .tag.now::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:1px;animation:live 1.2s ease-in-out infinite}
  @keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
  .day,.tab,.alink,.map,.links a,.phone a,.nbi a,.ovr{transition:transform .12s ease}
  .day:active,.tab:active,.alink:active,.map:active,.links a:active,.phone a:active,.nbi a:active,.ovr:active{transform:scale(.92)}
  @media (prefers-reduced-motion: reduce){ .reveal,.reveal-x{opacity:1!important;transform:none!important} .flip,.reveal.in,.reveal-x.in,.big.sos,.tag.now::before{animation:none!important} }
  .tag.tt{background:color-mix(in srgb, var(--c) 15%, transparent);color:var(--c);text-transform:none;letter-spacing:0;font-size:12px;border-radius:999px;padding:2px 9px}
  .tag.upd{background:#7b4bd1;color:#fff;text-transform:none;letter-spacing:0;font-size:12px;border-radius:999px;padding:2px 9px}
  .day{position:relative}
  .updot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #7b4bd1}
  .nextup{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid #f5c518;border-radius:14px;padding:10px 14px;margin:0 0 14px}
  .nextup small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#b38a00}
  .nextup b{display:block;font-size:15px}
  .nextup span{font-size:13px;color:var(--muted)}
  #help{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;transition:transform .45s cubic-bezier(.3,1.1,.5,1),opacity .35s ease}
  #help summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:#fff;background:rgba(37,163,90,.5);border:1px solid #fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #help summary::-webkit-details-marker{display:none}
  #help.gone{transform:translateY(-60px);opacity:0;pointer-events:none}
  .helpbox{position:absolute;right:0;bottom:46px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px;min-width:200px;animation:rise .2s ease}
  .helpbox a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
  .helpbox a small{font-weight:400;color:var(--muted);font-size:12px}
  .helpbox a:active{background:var(--bg)}
  .helpbox a.sos{color:#ff3438;border-top:1px solid var(--line);border-radius:0 0 10px 10px}
  .walk{display:inline-block;margin-left:6px;font-size:12px;font-weight:500;color:var(--muted)}
  a.card.sosc{display:block;color:var(--ink);text-decoration:none;border-color:#ff3438;transition:transform .12s ease}
  a.card.sosc:active{transform:scale(.97)}
  .sosrow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .sosrow .big{margin-bottom:0}
  .callme{display:inline-block;font-size:13px;font-weight:700;color:#ff3438}
  #splash{position:fixed;inset:0;z-index:100;background:var(--accent);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease .1s}
  #splash .sp-in{text-align:center;animation:splashIn .5s ease both}
  #splash .sp-w{color:#fff;font-size:18px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-bottom:10px}
  #splash .wm{width:min(70vw,320px);height:auto;display:block;transition:transform .7s cubic-bezier(.5,0,.2,1)}
  #splash .sp-w{transition:opacity .3s ease}
  #splash.out .sp-w{opacity:0}
  #splash.out{opacity:0}
  @keyframes splashIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  .ripple{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:90;border:2px solid rgba(123,75,209,.55);background:radial-gradient(circle,rgba(123,75,209,.18),rgba(123,75,209,0) 70%);transform:scale(0);opacity:0;animation:ripple .8s cubic-bezier(.2,.6,.3,1) forwards}
  .ripple.white,.ripple.white{border-color:rgba(255,255,255,.85);background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,0) 70%)}
  @keyframes ripple{0%{transform:scale(0);opacity:.9}100%{transform:scale(var(--rs,7));opacity:0}}
  @media (prefers-color-scheme: dark){ .ripple{border-color:rgba(200,180,255,.55);background:radial-gradient(circle,rgba(200,180,255,.18),rgba(200,180,255,0) 70%)} }
  .note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .info h2{font-size:16px;margin:22px 0 8px}
  .info .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px;line-height:1.5}
  .info .big{font-size:26px;font-weight:700;color:var(--accent)}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .tabs{flex-wrap:wrap;justify-content:center;width:100%}
  .top{justify-content:center}
  html,body{overscroll-behavior-y:none}
  .logoband{background:var(--accent);text-align:center;padding:22px 16px 6px}
  .logoband .lb-sub{color:#fff;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-top:8px}
  .logoband .wm{display:block;overflow:visible;width:min(340px,80%);height:auto;margin:0 auto}
  .artist{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  .artist .pic{aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;letter-spacing:.02em;background:var(--c)}
  .artist .pic img{width:100%;height:100%;object-fit:cover}
  .avrow{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;margin:0 -2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .avrow::-webkit-scrollbar{display:none}
  .av{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
  .avp{width:58px;height:58px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;font-weight:700;font-size:18px;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--c)}
  .avp img{width:100%;height:100%;object-fit:cover}
  .av small{font-size:11px;line-height:1.2;text-align:center;max-width:64px}
  .av:active .avp{transform:scale(.94)}
  .artist .in{padding:14px 16px 16px}
  .artist h3{margin:0;font-size:19px}
  .artist .role{color:var(--muted);font-size:14px;margin-top:2px}
  .artist p{font-size:15px;line-height:1.5;margin:10px 0 0}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .links a{font-size:13px;font-weight:700;color:var(--link,#7b4bd1);background:var(--link-soft,#fff);text-decoration:none;border:1px solid var(--link,#7b4bd1);border-radius:999px;padding:5px 12px}
  .links .nbx{display:inline-flex;align-items:center;gap:0;border:1px solid var(--link,#7b4bd1);border-radius:999px;background:var(--link-soft,#fff);transition:background .3s,padding .3s}
  .links .nbx a{border:0;border-radius:999px;background:transparent}
  .links .nbx .nbs{max-width:0;padding-left:0;padding-right:0;margin-left:0;opacity:0;overflow:hidden;white-space:nowrap;background:var(--card,#fff);transition:max-width .4s cubic-bezier(.3,.7,.2,1),opacity .3s,padding .4s,margin .4s}
  .links .nbx.open{background:var(--link,#7b4bd1);padding:2px}
  .links .nbx.open>a:first-child{color:#fff;padding:3px 10px}
  .links .nbx.open .nbs{max-width:140px;padding:3px 11px;margin-left:3px;opacity:1}
  .links .nbx,.links .nbx.open{border:0;background:none;padding:0}

  .mm-f,.mm-b{position:absolute;inset:0;border-radius:10px;-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden;background-size:cover;background-position:center}
  .mm-f{transform:rotateY(180deg)}
  .mm-f small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:1.2;padding:4px 3px}
  .mm-card.done .mm-f{box-shadow:inset 0 0 0 3px #2e8b57}
  .qz-pic{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--line)}
  .qz-pic img{width:100%;height:100%;object-fit:cover;display:block}
  .qz-bar{height:6px;width:100%;background:var(--line);border-radius:3px;overflow:hidden}
  .qz-bar i{display:block;height:100%;background:var(--accent);width:100%}
  .qz-opts{display:grid;gap:8px;width:100%}
  .qz-opt{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;text-align:left;position:relative;cursor:pointer}
  .qz-opt.ok{background:#2e8b57;color:#fff;border-color:#2e8b57}
  .qz-opt.no{background:#ff3438;color:#fff;border-color:#ff3438}
  .tv-q{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:18px;line-height:1.35}
  .tv-q img{width:150px;height:150px;object-fit:cover;border-radius:50%}
  .tv-who{display:flex;align-items:center;gap:10px;text-align:left;min-height:56px}
  .tv-who img{width:52px;height:52px;object-fit:cover;border-radius:50%}
  .tv-who span{font-weight:700;font-size:15px}
  .tv-who small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  .tv-q img.mc-img{width:100%;height:190px;object-fit:cover;border-radius:14px}
  .mc-note{font-size:14px;line-height:1.45;color:var(--ink);min-height:1em;max-width:420px}
  .qz-opts.two{grid-template-columns:1fr 1fr}
  .qz-opt.tf{text-align:center;font-weight:700;font-size:17px;padding:16px}
  .tl-list{display:flex;flex-direction:column;gap:8px;width:100%}
  .tl-item{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:2px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;text-align:left;position:relative;cursor:pointer}
  .tl-item i{grid-row:span 2;width:28px;height:28px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700}
  .tl-item.sel i{border:0;background:var(--accent);color:#fff}
  .tl-item small{color:var(--muted);font-size:13px}
  .tl-item small:empty{display:none}
  .tl-item.ok{border-color:#2e8b57;box-shadow:inset 3px 0 0 #2e8b57}
  .tl-item.no{border-color:#ff3438;box-shadow:inset 3px 0 0 #ff3438}
  .tl-item.ok i{background:#2e8b57}.tl-item.no i{background:#ff3438}
  /* BARNA ARTS brand palette (from the wordmark): red #FF3438, faded #DA8184, blue-grey #C5DAE1, ink #150505 */
  :root{--bg:#f3f7f8;--card:#fff;--ink:#150505;--muted:#6b5b5b;--line:#d6e3e8;--accent:#ff3438;--accent-soft:#ffe9ea;
    --hd:#c5dae1;--hd-ink:#150505;--chip:rgba(255,255,255,.55);--fade:#da8184;--link:#d91e22;--link-soft:#fff;--glow:rgba(255,52,56,.55)}
  @media (prefers-color-scheme: dark){ :root{--bg:#150505;--card:#231313;--ink:#f6ecec;--muted:#b9a6a6;--line:#3a2828;--accent-soft:#3a1a1b;
    --hd:#1e2a2e;--hd-ink:#c5dae1;--chip:rgba(255,255,255,.07);--link:#ff8a8d;--link-soft:var(--card)} }
  .logoband,header,#splash,.g-top{background:var(--hd);color:var(--hd-ink)}
  .logoband .lb-sub,#splash .sp-w{color:var(--hd-ink)}
  .tab{border-color:color-mix(in srgb,var(--hd-ink) 30%,transparent);color:var(--hd-ink)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .g-top button{border-color:color-mix(in srgb,var(--hd-ink) 30%,transparent);color:var(--hd-ink)}
  .day{background:var(--chip);color:var(--hd-ink)}
  .day small,.day.ext small,.day.we small{color:var(--hd-ink)}
  .day.we{background:color-mix(in srgb,var(--hd-ink) 12%,transparent)}
  .daysep{background:color-mix(in srgb,var(--hd-ink) 30%,transparent)}
  .day.on,.day.we.on{border:2px solid #fff;padding:5px 9px;background:var(--chip);box-shadow:inset 0 0 12px 3px rgba(255,255,255,.8)}
  @media (prefers-color-scheme: dark){ .day.on,.day.we.on{background:rgba(255,255,255,.16);box-shadow:inset 0 0 14px 4px rgba(255,255,255,.55)} }
  /* Selected day (both modes): same tint as the other days, thin white edge, red bottom bar */
  .days .day.on{background:var(--chip);border-color:#fff;box-shadow:inset 0 0 4px rgba(255,255,255,.45),inset 0 -4px 0 var(--accent)}
  .days .day.we.on{background:color-mix(in srgb,var(--hd-ink) 12%,transparent)}
  .days .day.today.on{animation-name:todayGoldOnR}
  @keyframes todayGoldOnR{0%,100%{box-shadow:inset 0 -4px 0 var(--accent),0 0 0 2px #ffd84a,0 0 6px 2px rgba(255,210,60,.55)}50%{box-shadow:inset 0 -4px 0 var(--accent),0 0 0 3px #ffd84a,0 0 18px 7px rgba(255,210,60,1)}}
  .day.today,.day.we.today{border:2px solid #ffd84a;padding:5px 9px;animation:todayGold 4.5s ease-in-out infinite}
  .day.today.on{border-color:#fff;animation:todayGoldOn 4.5s ease-in-out infinite}
  @keyframes todayGold{0%,100%{box-shadow:0 0 6px 1px rgba(255,210,60,.55)}50%{box-shadow:0 0 16px 6px rgba(255,210,60,1)}}
  @keyframes todayGoldOn{0%,100%{box-shadow:inset 0 0 12px 3px rgba(255,255,255,.75),0 0 0 2px #ffd84a,0 0 6px 2px rgba(255,210,60,.55)}50%{box-shadow:inset 0 0 12px 3px rgba(255,255,255,.75),0 0 0 3px #ffd84a,0 0 18px 7px rgba(255,210,60,1)}}
  .updot{background:var(--accent);box-shadow:0 0 0 2px var(--hd)}
  .days{margin-top:-12px;padding-top:24px;margin-bottom:-10px;padding-bottom:24px;position:relative}
  .top{position:relative;z-index:2}
  .note.ovglow,.artist.now,.venue.now,.ov.today{border-color:var(--accent);box-shadow:0 0 14px 4px var(--glow)}
  .nextup{border-left-color:var(--accent)} .nextup small{color:var(--accent)}
  @keyframes hit{0%,100%{box-shadow:0 0 0 0 rgba(255,52,56,0)}17%{box-shadow:0 0 22px 8px var(--glow)}}
  .ripple{border-color:var(--glow);background:radial-gradient(circle,rgba(255,52,56,.16),rgba(255,52,56,0) 70%)}
  .ripple.white{border-color:color-mix(in srgb,var(--accent) 60%,transparent);background:radial-gradient(circle,rgba(255,52,56,.14),rgba(255,52,56,0) 70%)}
  .tag.upd{background:var(--accent)}
  .tag.tbc{background:#fce4e5;color:#a8383c}
  .tag.opt{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--muted)}
  .tag.ext{background:var(--hd);color:var(--hd-ink)}
  @media (prefers-color-scheme: dark){ .tag.tbc{background:#3a1a1b;color:#f2a4a6} .tag.ext{background:#2e4248;color:#c5dae1} }
  /* Trippy logo: the echo copy slides down, then up past its place, then back */
  .wm{overflow:visible}
  .wm .ech{opacity:0}
  .wm.trip .ech{animation:trip 15.6s cubic-bezier(.5,0,.2,1) 1}
  @keyframes trip{0%{transform:translateY(0);opacity:0}38%{transform:translateY(15.6px);opacity:1}75%{transform:translateY(-6px);opacity:1}100%{transform:translateY(0);opacity:0}}
  /* Weekends in light mode: warm yellow so Sat/Sun stand out */
  .days .day.we,.days .day.we.on{background:var(--we);color:var(--we-ink)}
  .days .day.we small{color:var(--we-ink)}
</style>
</head>

// Lightweight confetti burst
function confetti(from){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const x=c.getContext("2d"), W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio;
  const O=(from&&from.length?from:[{x:innerWidth/2,y:innerHeight*.35,w:innerWidth*.3}]).map(o=>({x:o.x*devicePixelRatio,y:Math.min(Math.max(o.y,40),innerHeight-40)*devicePixelRatio,w:o.w*devicePixelRatio}));
  const cols=["#ff3438","#f5c518","#7b4bd1","#ffffff","#2e8b57","#ff8fb1"];
  const P=Array.from({length:70*O.length},(_,i)=>{const o=O[i%O.length]; return {x:o.x+(Math.random()-.5)*o.w,y:o.y,vx:(Math.random()-.5)*W*.02,vy:-Math.random()*H*.022-H*.006,s:(6+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]};});

    P.forEach(p=>{ p.vy+=H*.0006; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.globalAlpha=Math.max(0,1-t/170); x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });

}

// Tears falling from the departure card
function tears(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const card=[...document.querySelectorAll(".ev")].find(e=>/Departure/.test(e.textContent));
  const dpr=devicePixelRatio||1, c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const x=c.getContext("2d"), W=c.width=innerWidth*dpr, H=c.height=innerHeight*dpr;
  const r=card?card.getBoundingClientRect():null;
  const top = r && r.bottom>0 && r.bottom<innerHeight ? r.bottom-6 : 0, L0 = r?r.left+16:0, Lw = r?r.width-32:innerWidth;
  // Tears, not rain: few drops, they well up, hang, then roll slowly down leaving a wet trail
  if(card){ const em=document.createElement("div"); em.className="tearface"; em.textContent="🥲";
    em.style.left=(r.right-46)+"px"; em.style.top=(r.top+10)+"px"; document.body.appendChild(em); setTimeout(()=>em.remove(),3200); }
  const P=Array.from({length:14},(_,i)=>({x:(L0+Math.random()*Lw)*dpr, y:(top-2)*dpr, y0:(top-2)*dpr, d:i*260+Math.random()*300,
    v:0, s:(4+Math.random()*3)*dpr, hang:350+Math.random()*700, born:0, grow:0}));
  function drop(p){ const s=p.s*Math.min(1,p.grow);
    // wet trail
    if(p.y>p.y0+2){ const ty=Math.max(p.y0,p.y-46*dpr), tg=x.createLinearGradient(0,ty,0,p.y); tg.addColorStop(0,"rgba(170,205,240,0)"); tg.addColorStop(1,"rgba(170,205,240,.45)");
      x.strokeStyle=tg; x.lineWidth=s*.7; x.lineCap="round"; x.beginPath(); x.moveTo(p.x,ty); x.lineTo(p.x,p.y-s); x.stroke(); }
    x.save(); x.translate(p.x,p.y);
    const g=x.createRadialGradient(-s*.3,0,s*.1,0,0,s*1.4); g.addColorStop(0,"rgba(235,245,255,.75)"); g.addColorStop(1,"rgba(120,170,225,.6)");
    x.fillStyle=g; x.beginPath(); x.moveTo(0,-s*1.8); x.bezierCurveTo(s*.8,-s*.4,s,s,0,s); x.bezierCurveTo(-s,s,-s*.8,-s*.4,0,-s*1.8); x.fill();
    x.strokeStyle="rgba(90,140,200,.45)"; x.lineWidth=.8*dpr; x.stroke();
    x.fillStyle="rgba(255,255,255,.9)"; x.beginPath(); x.ellipse(-s*.35,s*.05,s*.16,s*.3,-.4,0,6.28); x.fill(); x.restore(); }
  const t0=performance.now();
  (function f(t){ const el=t-t0; x.clearRect(0,0,W,H); let alive=false;
    P.forEach(p=>{ if(el<p.d){ alive=true; return; }
      if(p.grow<1){ p.grow+=.03; if(p.grow>=1) p.born=el; }
      else if(el-p.born>p.hang){ p.v=Math.min(p.v+.035*dpr, 3.2*dpr); p.y+=p.v; }
      if(p.y<H+20*dpr){ alive=true; drop(p); } });
    if(alive && el<9000) requestAnimationFrame(f); else c.remove(); })(t0);
}

// Lunch (gap starting 11:30–15:00) and dinner (gap starting 17:00+, next thing at 7 PM or later), at least 45 min
function breaksFor(items){
  const out = {}; let maxEnd = null, lunch=false, dinner=false;
  for(let i=0;i<items.length-1;i++){
    const a=items[i]; if(a.e){ const m=toM(a.e); if(maxEnd===null||m>maxEnd[0]) maxEnd=[m,a.e]; }
    const b=items[i+1]; if(!maxEnd||!b.s) continue;
    const g0=maxEnd[0], g1=toM(b.s); if(g1-g0<45) continue;
    if(!lunch && g0>=690 && g0<=900){ out[i]=`🥪 Lunch break · ${t12(maxEnd[1])} – ${t12(b.s)}`; lunch=true; }
    else if(!dinner && g0>=1020 && g1>=1080 && b.t!=="free" && !items.slice(0,i+1).some(x=>/dinner/i.test(x.title))){ out[i]=`🍝 Dinner break · ${t12(maxEnd[1])} – ${t12(b.s)}`; dinner=true; }
  }
  return out;
}

// ---- Next up (during the program, on today's page)
function nextUp(){
  const its=(S[now.date]||[]).filter(x=>x.s).sort((a,b)=>a.s.localeCompare(b.s));
  const cur=its.find(x=>x.e && now.time>=x.s && now.time<x.e);
  const nx=its.find(x=>x.s>now.time);
  const show=(x,lbl)=>{ const v=x.v?V[x.v]:null;
    const dir=v&&v.a?`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(V.yugo.a)}&destination=${encodeURIComponent(v.a)}&travelmode=transit`:"";
    return `<div class="nextup"><div><small>${lbl}</small><b>${x.title}</b><span>${t12(x.s)}${v?` · ${v.n.split(" — ")[0]}`:""}</span></div>${dir?`<a class="map" style="margin:0" href="${dir}" target="_blank" rel="noopener">Route →</a>`:""}</div>`; };
  if(nx) return show(nx, cur?"Next, after this":"Next up");
  if(cur) return show(cur,"Happening now");
  return `<div class="nextup"><div><small>Done for today</small><b>Nothing else scheduled</b><span>See tomorrow →</span></div></div>`;
}

// ---- "Updated" tags: compare each session with what this phone saw before
const SEEN_KEY="inter27-seen";
let seen={}, seenInit=false;
try{ const raw=localStorage.getItem(SEEN_KEY); if(raw){ seen=JSON.parse(raw); seenInit=true; } }catch(_){}
const sig=x=>[x.s,x.e,x.v||"",(x.vs||[]).join(","),x.who||"",x.tbc?1:0].join("|");
const evKey=(d,x)=>d+"|"+x.title;
const FRESH=24*3600e3;
(function diffAll(){
  const t=Date.now(), next={};
  for(const d of dates) for(const x of S[d]){
    const k=evKey(d,x), s=sig(x), old=seen[k];
    if(!seenInit) next[k]={h:s,t:0};
    else if(!old) next[k]={h:s,t,n:1};
    else if(old.h!==s) next[k]={h:s,t,u:1};
    else next[k]=old;
  }
  seen=next; try{ localStorage.setItem(SEEN_KEY,JSON.stringify(seen)); }catch(_){}
})();
function freshState(d,x){ const e=seen[evKey(d,x)]; if(!e||!e.t||Date.now()-e.t>FRESH) return ""; return e.u?"Updated":e.n?"New":""; }
function updTag(d,x){ const s=freshState(d,x); return s?`<span class="tag upd">${s}</span>`:""; }
function dayFresh(d){ return S[d].some(x=>freshState(d,x)); }

function renderSchedule(){
  const d = current, items = [...S[d]].sort((a,b)=>(a.s||"00:00").localeCompare(b.s||"00:00"));
  const isToday = d===now.date;
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h1 style="margin-bottom:0">${fmt(d,{weekday:"long",month:"long",day:"numeric"})}</h1><a class="alink" style="margin:0;white-space:nowrap" href="#overview">All days</a></div>`;
  html += isToday ? `<p class="sub">Today</p>` : `<div style="height:14px"></div>`;
  if(dayPlan(d).length>2) html += `<div class="routebar"><span class="rpill"><span class="rl">🗺️ How to get around</span><button type="button" class="rp" data-route="${d}"><b>▶ Play</b></button><button type="button" class="rs" data-route="${d}" data-steps="1">☰ Step by step</button></span></div>`;
  if(extOnly(d)) html += `<div class="note">This day is for the <b>extension group</b> only.</div>`;
  if(isToday) html += nextUp();
  const brk = breaksFor(items);
  html += items.map((x,ix)=>{
    const venue = x.v ? V[x.v] : null;
    const live = isToday && x.s && x.e && now.time>=x.s && now.time<x.e;
    const tags = [
      live?`<span class="tag now">Now</span>`:"",
      `<span class="tag tt">${LABEL[x.t]}</span>`,
      updTag(d,x),
      x.opt?`<span class="tag opt">Optional</span>`:"",
      x.tbc?`<span class="tag tbc">To be confirmed</span>`:"",
      x.ext?`<span class="tag ext">Extension group</span>`:"",
    ].join("");
    const time = x.s ? `${t12(x.s)}${x.e?`<small>to ${t12(x.e)}</small>`:""}` : `<small>All day</small>`;
    return `<div class="ev reveal${live?" now":""}${x.opt||x.t==="free"?" opt":""}" id="ev-${+d.slice(8)}-${S[d].indexOf(x)}" style="--c:var(${COL[x.t]})">
      <div class="time">${time}</div>
      <div class="body">
        <div class="title">${ico(x)} ${x.title}</div>
        ${x.who?`<div class="who">${x.who}</div>`:""}
        ${x.vs?x.vs.map(k=>`<div class="where">${V[k].n}<br><span class="who">${street(V[k])}</span></div><a class="map" href="${mapLink(V[k].a)}" target="_blank" rel="noopener">Maps →</a>${V[k].ig?`<a class="map" style="margin-left:6px" href="https://instagram.com/${V[k].ig}" target="_blank" rel="noopener">IG ↗</a>`:""}`).join(""):""}
        ${venue?`<div class="where">${venue.n}${venue.a?`<br><span class="who">${street(venue)}</span>`:""}</div>${venue.ig?`<a class="map" href="https://instagram.com/${venue.ig}" target="_blank" rel="noopener">IG ↗</a>`:""}`:x.vs?"":
          (x.t!=="travel"&&x.t!=="free"?`<div class="where who">Location to be announced</div>`:"")}
        <div class="tags">${tags}</div>
        ${venue&&venue.a?`<a class="map" href="${mapLink(venue.a)}" target="_blank" rel="noopener">Maps →</a>`:""}
        ${x.link?`<a class="alink" style="margin-left:6px" href="${x.link[1]}" target="_blank" rel="noopener">${x.link[0]} ↗</a>`:""}
        ${x.links?x.links.map(l=>`<a class="alink" style="margin-left:6px" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join(""):""}
        ${x.ar?artistChips(x.ar):""}
      </div></div>` + (brk[ix]?`<div class="lunch"><span>${brk[ix]}</span></div>`:"");
  }).join("");
  return html;
}

function initials(n){ return n.split(/[ &·]+/).filter(w=>/^[A-ZÀ-Ý]/.test(w)).slice(0,2).map(w=>w[0]).join(""); }

// Slowly drift the face row so it's clear there are more; stops while touched, resumes after a pause
let avRAF=0;
function driftAvatars(){
  cancelAnimationFrame(avRAF);
  const r=document.getElementById("avrow"); if(!r) return;
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let dir=1, pausedUntil=0, pos=r.scrollLeft;


  const hold=ms=>{ pausedUntil=performance.now()+ms; };
  ["touchstart","pointerdown","wheel"].forEach(ev=>r.addEventListener(ev,()=>hold(5000),{passive:true}));
  r.addEventListener("scroll",()=>{ if(performance.now()<pausedUntil) pos=r.scrollLeft; },{passive:true});
  (function f(t){
    if(!document.body.contains(r)) return;
    const max=r.scrollWidth-r.clientWidth;
    if(max>0 && t>pausedUntil){
      pos+=dir*0.35; if(pos>=max){ pos=max; dir=-1; hold(1500); } else if(pos<=0){ pos=0; dir=1; hold(1500); }
      r.scrollLeft=pos;
    }
    avRAF=requestAnimationFrame(f);
  })(performance.now());
}

function filterVenueCards(){

    const par=cards[0].parentNode, ord=mapDay==="all"?[]:dayVenueOrder(mapDay);
    const rank=c=>{ const i=ord.indexOf(c.dataset.k); return i>=0 ? i : ord.length + (+c.dataset.i); };

const STN = {yugo:"Drassanes (L3)", caldera:"Les Corts (L3)", taller46:"Vallcarca (L3)", pedrera:"Diagonal (L3)", batllo:"Passeig de Gràcia (L3)",
  tapies:"Passeig de Gràcia (L3)", servei:"Passeig de Gràcia (L3)", auditori:"Marina (L1)", neil:"Arc de Triomf (L1)", upf:"Ciutadella | Vila Olímpica (L4)",

  visiva:"Poble Sec (L3) or Sant Antoni (L2)", macba:"Liceu (L3)", filmo:"Liceu (L3)", joaquin:"Liceu (L3)", unmaking:"Liceu (L3)", santam:"Drassanes (L3)"};
const WALK_MAX = 25; // minutes; longer than this → public transport
function walkMin(A,B){ return Math.max(1, Math.round(L.latLng(A).distanceTo(L.latLng(B))*1.35/80)); }
function dayPlan(d){
  // Stops in order with the first session time at each
  const stops=[];
  for(const x of [...(S[d]||[])].sort((a,b)=>(a.s||"").localeCompare(b.s||"")))
    for(const k of [...(x.vs||[]),...(x.v?[x.v]:[])].map(vkey)) if(VC[k]){
      const last=stops[stops.length-1];
      if(last && last.k===k){ if(!last.evs.includes(x)) last.evs.push(x); }
      else stops.push({k,s:x.s,title:x.title,evs:[x]});
    }
  const seq=[{k:"yugo",start:1,evs:stops[0]&&stops[0].k==="yugo"?stops[0].evs:[]}, ...stops.filter((p,i)=>!(i===0&&p.k==="yugo")), {k:"yugo",end:1,evs:[]}];
  // drop a trailing duplicate yugo if the day already ends there
  if(seq.length>2 && seq[seq.length-2].k==="yugo") seq.splice(seq.length-2,1);
  return seq;
}
function legInfo(a,b){
  const A=VC[a], B=VC[b], m=walkMin(A,B), walk=m<=WALK_MAX;
  const url=`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(V[a].a)}&destination=${encodeURIComponent(V[b].a)}&travelmode=${walk?"walking":"transit"}`;
  let how = walk ? `🚶 Walk · about ${m} min` : `🚇 Metro${STN[a]&&STN[b]&&STN[a]!==STN[b]?` · ${STN[a]} → ${STN[b]}`:""} <small>· ${(L.latLng(A).distanceTo(L.latLng(B))*1.35/1000).toFixed(1)} km on foot (about ${m} min)</small>`;

}

function renderVenues(){

    <div class="sess">${days[k].size?"":`<span class="tag tbc">Date to be confirmed</span>`}${[...days[k]].sort().map(d=>`<a href="${evLink(d,x=>(x.vs||[]).includes(k)||(x.v&&(x.v===k||V[x.v].g===k)))}">${fmt(d,{weekday:"short",month:"short",day:"numeric"})} →</a>`).join("")}</div>

let VOICES=[];
function loadVoices(){ try{ VOICES=speechSynthesis.getVoices(); }catch(_){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function say(text,lang){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.replace(/…/g,"").replace(/ \/ /g,". "));
    u.lang=lang; u.rate=.85;
    const v=VOICES.find(v=>v.lang&&v.lang.replace("_","-").toLowerCase()===lang.toLowerCase())||VOICES.find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.slice(0,2)));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(_){}
}

  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  revealObs = new IntersectionObserver(entries=>{
    let k=0;
    entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top).forEach(e=>{
      const el=e.target; el.style.setProperty("--d",(k++*80)+"ms"); el.classList.add("in"); revealObs.unobserve(el);
      const big=el.querySelector&&el.querySelector(".big"); if(big){ setTimeout(()=>big.classList.add("sos"),400+(k*80)); }

}

<script>
// ---------- Hidden games: double-tap or long-press the logo ----------
(function(){
const box=document.getElementById("game"), body=document.getElementById("g-body"), ttl=document.getElementById("g-title");
let timers=[], raf=0, cur=null, bag=[];
const later=(f,ms)=>{ const t=setTimeout(f,ms); timers.push(t); return t; };
const clearAll=()=>{ timers.forEach(clearTimeout); timers=[]; cancelAnimationFrame(raf); };
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const tick=ms=>{ try{ haptic(ms||8); }catch(_){} };
function getBest(k){ try{ return +localStorage.getItem("g-"+k)||0; }catch(_){ return 0; } }
function setBest(k,v,lower){ const o=getBest(k); if(!o || (lower? v<o : v>o)){ try{ localStorage.setItem("g-"+k,v); }catch(_){} return true; } return false; }

// Sound
let AC=null, NB=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ AC=null; } } if(AC && AC.state==="suspended") AC.resume(); return AC; }
const clock=()=> AC ? AC.currentTime : performance.now()/1000;
function tone(f,dur,type,vol,at){ const a=ac(); if(!a) return; const t=at||a.currentTime; const o=a.createOscillator(), g=a.createGain();
  o.type=type||"triangle"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.25,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.25));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+(dur||.25)+.05); }
function clap(at,vol){ const a=ac(); if(!a) return; const t=at||a.currentTime;
  if(!NB){ NB=a.createBuffer(1,a.sampleRate*.2,a.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); }
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=NB; f.type="bandpass"; f.frequency.value=1400; f.Q.value=.9;
  g.gain.setValueAtTime(vol||.9,t); g.gain.exponentialRampToValueAtTime(.001,t+.16); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+.2); }

// Venues with photos (used by two games)
const VP=Object.keys(VPHOTOS).filter(k=>V[k]).map(k=>({k, n:V[k].n.split(" — ")[0], img:VPHOTOS[k]}));

// 1. Copy the choreography
const SIMON={title:"Copy the choreography", start(){
  const P=[{e:"🩰",c:"--c-studio",f:329.6},{e:"💃",c:"--c-guest",f:440},{e:"🕺",c:"--c-outing",f:554.4},{e:"🤸",c:"--c-perf",f:659.3}];
  body.innerHTML=`<p class="g-msg" id="sm-msg">Watch the dancers, then repeat their moves in the same order.</p>
    <div class="sm-grid">${P.map((p,i)=>`<button class="sm-pad" data-i="${i}" style="--pc:var(${p.c})"><span>${p.e}</span></button>`).join("")}</div>
    <div class="g-score">Round <b id="sm-r">0</b> · Best <b id="sm-b">${getBest("simon")}</b></div><button class="g-btn" id="sm-go">Start</button>`;
  const pads=[...body.querySelectorAll(".sm-pad")], msg=body.querySelector("#sm-msg"), go=body.querySelector("#sm-go");
  let seq=[], idx=0, on=false;

  function next(){ seq.push(Math.random()*4|0); body.querySelector("#sm-r").textContent=seq.length; msg.textContent="Watch…"; on=false;
    const gap=Math.max(300,620-seq.length*25); seq.forEach((i,k)=>later(()=>flash(i),500+k*gap));

  go.onclick=()=>{ ac(); seq=[]; go.hidden=true; next(); };
  pads.forEach(p=>p.onpointerdown=()=>{ if(!on) return; const i=+p.dataset.i; flash(i);
    if(i!==seq[idx]){ on=false; tone(110,.5,"sawtooth",.2); tick([40,40,40]); const r=seq.length-1;
      const nb=setBest("simon",r); body.querySelector("#sm-b").textContent=getBest("simon");
      msg.textContent=`Out of step! You remembered ${r} move${r===1?"":"s"}.${nb&&r?" New best!":""}`; go.textContent="Play again"; go.hidden=false; return; }
    if(++idx===seq.length){ on=false; msg.textContent="Nice! Next round…"; later(next,800); } });
}};

// 2. Flamenco compás: clap on the accents of the 12-beat cycle
const COMPAS={title:"Flamenco compás", start(){
  const ACC=[2,5,7,9,11], BEAT=.42, CYC=4; // 1st cycle: listen. Then 3 cycles to clap
  const dots=Array.from({length:12},(_,i)=>{ const a=(i/12)*Math.PI*2-Math.PI/2+Math.PI*2/12, x=100+78*Math.cos(a), y=100+78*Math.sin(a), A=ACC.includes(i);
    return `<g class="cp-d${A?" acc":""}" id="cp${i}"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${A?15:10}"/><text x="${x.toFixed(1)}" y="${(y+4.5).toFixed(1)}">${i+1}</text></g>`; }).join("");
  body.innerHTML=`<p class="g-msg" id="cp-msg">Flamenco counts in 12. Clap on the big red beats: 3, 6, 8, 10 and 12. Listen to one round first, then join in. Turn your sound on.</p>
    <svg class="cp-ring" viewBox="0 0 200 200">${dots}<text x="100" y="108" class="cp-mid" id="cp-mid">👏</text></svg>
    <div class="cp-fb" id="cp-fb"></div>
    <button class="cp-clap" id="cp-clap" aria-label="Clap">👏</button>
    <div class="g-score">Best <b id="cp-b">${getBest("compas")}</b>%</div><button class="g-btn" id="cp-go">Start</button>`;
  const fb=body.querySelector("#cp-fb"), mid=body.querySelector("#cp-mid"), go=body.querySelector("#cp-go"), msg=body.querySelector("#cp-msg");
  let t0=0, running=false, hit={}, offs=0, pts=0, last=-1;
  const scoredFrom=12, total=12*CYC;
  go.onclick=()=>{ ac(); go.hidden=true; hit={}; offs=0; pts=0; last=-1; fb.textContent=""; running=true;
    t0=clock()+.8;
    if(AC) for(let k=0;k<total;k++){ const t=t0+k*BEAT, a=ACC.includes(k%12);
      if(k<scoredFrom){ a ? clap(t,.9) : tone(220,.05,"square",.06,t); } else tone(a?660:330,.06,"triangle",a?.14:.07,t); }
    msg.textContent="Listen to the first round…";
    (function loop(){ const k=Math.floor((clock()-t0)/BEAT+.5);
      if(k!==last && k>=0 && k<total){ last=k; body.querySelectorAll(".cp-d").forEach(d=>d.classList.remove("on")); body.querySelector("#cp"+(k%12)).classList.add("on");
        mid.textContent = k<scoredFrom ? "👂" : String(Math.floor(k/12)); if(k===scoredFrom) msg.textContent="Your turn: clap on the red beats!"; }
      if(clock()<t0+total*BEAT+.3) raf=requestAnimationFrame(loop); else end(); })();
  };

    const max=ACC.length*(CYC-1)*3, pc=Math.max(0,Math.round((pts-offs)/max*100)); const nb=setBest("compas",pc);
    body.querySelector("#cp-b").textContent=getBest("compas");
    const hits=Object.keys(hit).length, miss=ACC.length*(CYC-1)-hits;
    msg.textContent=`${pc}% in compás. ${hits} claps on the beat, ${miss} missed, ${offs} off the beat.${nb&&pc?" New best!":""}`; fb.textContent=pc>=80?"¡Olé! 💃":pc>=50?"¡Bien!":"Keep practising"; go.textContent="Play again"; go.hidden=false; }
  body.querySelector("#cp-clap").onpointerdown=e=>{ e.preventDefault(); ac(); clap(0,.7); tick(10);
    if(!running) return; const tt=clock(), k=Math.round((tt-t0)/BEAT), dt=Math.abs(tt-(t0+k*BEAT));
    if(k<scoredFrom||k>=total) return;
    if(ACC.includes(k%12) && !hit[k] && dt<.17){ const p=dt<.075?3:1; hit[k]=1; pts+=p; fb.textContent=p===3?"Perfect!":"Good"; fb.className="cp-fb "+(p===3?"pf":"gd"); }
    else { offs++; fb.textContent="Off the beat"; fb.className="cp-fb off"; } };
}};

// 3. Trencadís memory
let TILE=null;
function trencadis(){ if(TILE) return TILE; const C=["#1f6fb5","#3b9ad9","#f2c230","#2e8b57","#f5f1e6","#ff3438","#7fc4e8","#e8a33d"];
  const N=5, s=100/N, pt=(i,j)=>[(i*s+(i&&i<N?(Math.random()-.5)*s*.6:0)).toFixed(1),(j*s+(j&&j<N?(Math.random()-.5)*s*.6:0)).toFixed(1)];
  const G=[]; for(let i=0;i<=N;i++){ G[i]=[]; for(let j=0;j<=N;j++) G[i][j]=pt(i,j); }

// Generic multiple-choice game: items [{q, a, o:[wrong…], img, note}]
function mcGame(key,title,intro,items,R,optsFn){ const G={title, start(){
  const qs=shuffle(items).slice(0,Math.min(R,items.length)); let r=0, score=0, streak=0, answered=false;

    <div class="g-score">Question <b id="mc-r">1</b>/${qs.length} · Score <b id="mc-s">0</b> · Best <b id="mc-b">${getBest(key)}</b></div><button class="g-btn" id="mc-next" hidden>Next →</button><button class="g-btn" id="mc-go" hidden>Play again</button>`;
  const qEl=body.querySelector("#mc-q"), opts=body.querySelector("#mc-opts"), note=body.querySelector("#mc-note"), msg=body.querySelector("#mc-msg"), nx=body.querySelector("#mc-next");
  function round(){ answered=false; note.textContent=""; nx.hidden=true; const q=qs[r]; body.querySelector("#mc-r").textContent=r+1;
    qEl.innerHTML=(q.img?`<img class="mc-img" src="${q.img}" alt="">`:"")+`<b>${q.q}</b>`;
    const o=optsFn?optsFn(q):shuffle([q.a,...shuffle(q.o).slice(0,3)]);
    opts.innerHTML=o.map(x=>`<button class="qz-opt${o.length===2?" tf":""}" data-o="${x.replace(/"/g,"&quot;")}">${x}</button>`).join("");
    opts.className="qz-opts"+(o.length===2?" two":""); opts.querySelectorAll(".qz-opt").forEach(b=>b.onclick=()=>answer(b)); }
  function answer(b){ if(answered) return; answered=true; const q=qs[r], ok=b.dataset.o===q.a;
    opts.querySelectorAll(".qz-opt").forEach(x=>{ if(x.dataset.o===q.a) x.classList.add("ok"); else if(x===b) x.classList.add("no"); });
    if(ok){ streak++; const p=100+(streak>1?25*(streak-1):0); score+=p; msg.textContent=streak>1?`Right! ${streak} in a row: +${p}`:`Right! +${p}`; tone(660,.15,"triangle",.2); later(()=>tone(880,.2,"triangle",.2),120); tick(10); }
    else { streak=0; msg.textContent=`Not quite. The answer is: ${q.a}`; tone(150,.35,"sawtooth",.15); tick([30,30,30]); }
    body.querySelector("#mc-s").textContent=score;
    if(q.note){ note.textContent=q.note; nx.hidden=false; nx.onclick=next; } else later(next,1700); }
  function next(){ if(++r<qs.length) return round(); const nb=setBest(key,score); body.querySelector("#mc-b").textContent=getBest(key);
    qEl.innerHTML=""; opts.innerHTML=""; note.textContent=""; nx.hidden=true; msg.textContent=`You scored ${score}.${nb&&score?" New best!":""}`;
    const g=body.querySelector("#mc-go"); g.hidden=false; g.onclick=()=>G.start(); }
  round(); }}; return G; }

  ["The emergency number is 112.",1,"112 works for police, ambulance and fire, and you can ask for English."],
  ["Waiters bring the bill as soon as you finish eating.",0,"Lingering is normal. Ask for it: “el compte, si us plau”."],
  ["Clubs only get busy after 1 AM.",1,"Nights start late here. Your program starts in the morning, so pace yourself!"],
  ["People usually say hello when entering a small shop or a lift.",1,"A quick “bon dia” or “hola” is polite."],
].map(([q,t,note])=>({q,a:t?"True":"False",note}));
const MANNERSG=mcGame("manners","Barcelona time & manners","True or false? Local habits that will help you fit in.",MANNERS,10,()=>["True","False"]);

// 11. Dance & art vocabulary
const VOC=[["Improvisation","Movement created in the moment, not set beforehand"],["Score","A set of instructions or rules that structures a performance"],["Site-specific","Work made for, and shaped by, a particular place"],["Contact improvisation","Dancing through shared weight and touch with a partner"],["Compás","The rhythmic cycle of a flamenco form, such as 12 beats"],["Palmas","Rhythmic hand-clapping in flamenco"],["Choreography","Composing movement into a structured piece"],["Dramaturgy","Shaping a work's meaning, structure and context"],["Installation","An artwork that occupies and transforms a whole space"],["Performance art","Live art where the artist's action is the work"],["Residency","A period when artists work in a host space to develop new work"],["Devising","Creating a piece collectively from the group's own material"],["Proprioception","The body's sense of its own position and movement"],["Canon","The same movement performed by dancers starting one after another"],["Unison","Dancers doing the same movement at the same time"],["Trencadís","Mosaic made from broken pieces of tile"],["Modernisme","The Catalan version of Art Nouveau, around 1890–1910"]];
const VOCAB=mcGame("vocab","Dance & art vocabulary","Words you'll hear from the artists this month. Pick the right meaning.",
  VOC.map(([t,d])=>Math.random()<.6 ? {q:t, a:d, o:VOC.filter(x=>x[1]!==d).map(x=>x[1])} : {q:d, a:t, o:VOC.filter(x=>x[0]!==t).map(x=>x[0])}),8);

const GAMES=[SIMON,COMPAS,MEMORY,QUIZ,TRIVIA,CATALAN,METROG,TIMELINE,GAUDIG,MANNERSG,VOCAB];
function play(g){ clearAll(); cur=g; ttl.textContent=g.title; body.scrollTop=0; g.start(); }
function nextGame(){ if(!bag.length){ bag=shuffle(GAMES); if(bag[0]===cur && bag.length>1) bag.push(bag.shift()); } play(bag.shift()); }
function openGames(){ if(!box.hidden) return; box.hidden=false; document.body.classList.add("g-open"); tick([10,30,10]); nextGame(); }
function closeGames(){ clearAll(); box.hidden=true; document.body.classList.remove("g-open"); body.innerHTML=""; }
box.querySelector(".g-x").onclick=closeGames;
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !box.hidden) closeGames(); });

// Logo: double-tap or long-press
const logo=document.querySelector(".logoband .wm"); if(!logo) return;
logo.draggable=false; logo.addEventListener("contextmenu",e=>e.preventDefault());
let lp=null, lpFired=false, lastUp=0, sx=0, sy=0;
logo.addEventListener("pointerdown",e=>{ lpFired=false; sx=e.clientX; sy=e.clientY; clearTimeout(lp); lp=setTimeout(()=>{ lpFired=true; openGames(); },550); });
logo.addEventListener("pointermove",e=>{ if(Math.hypot(e.clientX-sx,e.clientY-sy)>12) clearTimeout(lp); });
["pointercancel","pointerleave"].forEach(ev=>logo.addEventListener(ev,()=>clearTimeout(lp)));
logo.addEventListener("pointerup",()=>{ clearTimeout(lp); if(lpFired) return; const t=Date.now(); if(t-lastUp<380){ lastUp=0; openGames(); } else { lastUp=t; tripLogo(); } });
logo.addEventListener("dblclick",e=>e.preventDefault());
})();
</script>
<!-- ===== POP-UPS ===== -->
<style>
  #pp{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:ppfade .3s ease;cursor:pointer}
  #pp .pp-c{background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);color:var(--ink);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-top:4px solid var(--pc,var(--accent));border-radius:20px;width:min(100%,420px);max-height:78vh;overflow:auto;padding:18px 20px 16px;box-shadow:0 12px 50px rgba(0,0,0,.22),0 0 0 1px rgba(255,255,255,.06) inset;animation:ppin .35s cubic-bezier(.2,.9,.3,1.2)}
  #pp small.k{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--pc,var(--accent));margin-bottom:4px}
  #pp h3{margin:0 0 6px;font-size:19px;line-height:1.25}
  #pp p{margin:6px 0;font-size:15px;line-height:1.45}
  #pp .pp-m{color:var(--muted);font-size:14px}
  #pp ul{margin:8px 0;padding-left:0;list-style:none}
  #pp li{padding:7px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-size:15px;line-height:1.4}
  #pp li:last-child{border-bottom:0}
  #pp li.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  #pp li.ck input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
  #pp li a{color:var(--link);text-decoration:none}
  #pp .pp-b{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  #pp .pp-b a,#pp .pp-b button{font:inherit;font-size:15px;font-weight:600;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
  #pp .pp-b .pri{background:var(--accent);border-color:var(--accent);color:#fff}
  #pp .pp-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;opacity:.8}
  #pp.out{animation:ppfadeout .45s ease forwards}
  #pp.out .pp-c{animation:ppimplode .45s cubic-bezier(.6,0,.9,.4) forwards}
  @keyframes ppin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes ppimplode{0%{transform:none;opacity:1;filter:none}35%{transform:scale(1.04);opacity:1}100%{transform:scale(0) rotate(8deg);opacity:0;filter:blur(6px)}}
  @keyframes ppfadeout{to{opacity:0;-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0)}}
  @media (prefers-reduced-motion: reduce){ #pp.out .pp-c{animation:ppfadeout .2s forwards} }
  @keyframes ppfade{from{opacity:0}to{opacity:1}}
</style>
<script>
(function(){
/* ============================================================
   POP-UP SETTINGS: everything you may want to edit is here.
   Leave a field "" to hide that line. A pop-up whose main text
   is "" is not shown at all.
   Preview any moment: add ?popnow=2027-01-10T13:20 to the URL
   (and ?popreset to show pop-ups you already closed again).
   ============================================================ */
const POP = {
  nextUpMinutes: 40,        // "Next up" appears this long before a session in a new place
  showMinutes: 180,         // show reminders appear this long before the performance
  bringFrom: "18:00",       // "What to bring" appears from this time the evening before

  // 3 · Arrival welcome (7 Jan, first time they open the app)
  welcome: {
    title: "Welcome to Barcelona!",
    lines: [
      "🏠 <b>Yugo Barcelona Port</b>, C/ Portal de Santa Madrona 28. Rooms are ready from <b>3 PM</b>.",
      "🥂 <b>Welcome drink & ice-breaker games at 6 PM</b> in a private room at Yugo.",
      "💬 Join the group WhatsApp if you haven't yet.",
      "🚨 Emergency: <b>112</b>. Albert: +34 689 130 137 · Katie: +34 696 504 487",
      "📲 Add this app to your home screen so it's one tap away (Info tab → How to install)."
    ]
  },

  // 2 · What to bring. d = date, match = words in the session title
  bring: [
    {d:"2027-01-08", match:"Guided city tour",    text:"Comfortable walking shoes and a warm layer: the tour is about 4 hours outdoors."},
    {d:"2027-01-09", match:"Movement",            text:"Clothes you can move in freely, socks, and a water bottle."},
    {d:"2027-01-10", match:"Núria Andorrà",       text:""},  // TBD
    {d:"2027-01-11", match:"materials workshop",  text:"Clothes you don't mind getting dirty: you'll work with clay, mud and paint."},
    {d:"2027-01-12", match:"Visual artists",      text:""},  // TBD
    {d:"2027-01-12", match:"Museu Tàpies",        text:"Read the texts and watch the video (links on the session) before the talk."},
    {d:"2027-01-13", match:"Mixed-media",         text:""},  // TBD
    {d:"2027-01-14", match:"Collaborating",       text:"Movement clothes, socks, layers (studios can be chilly), water, and your visual journal."},
    {d:"2027-01-16", match:"Final presentation",  text:""}   // TBD
  ],

  // 5 · Before shows. match = words in the title. meet = where/when to meet
  shows: [
    {d:"2027-01-09", match:"Dimanche",        meet:"", note:"Visual theatre without words."},
    {d:"2027-01-12", match:"Flamenco",        meet:"", note:""},
    {d:"2027-01-15", match:"RUSH",            meet:"", note:"Ages 16+."},
    {d:"2027-01-17", match:"Frames Percussion", meet:"", note:""}
  ],

  // 6 · Departure checklists
  departure: {
    core: {d:"2027-01-18", note:"Extension group: you stay until Sat 23 Jan, so this isn't for you yet."},
    ext:  {d:"2027-01-23", note:""},
    items: [
      "Check out of Yugo by <b>10 AM</b>",
      "Return your room key/card at reception",
      "Check under the bed, in the bathroom and in the shared kitchen",
      "Passport, phone, charger, wallet",
      "Be at the airport <b>2–3 hours</b> before your flight",
      "Fill in the post-trip reflection when you're home"
    ]
  }
};
/* ============================================================ */

const LS="inter27-pop";
let done={}; try{ if(/[?&]popreset/.test(location.search)) localStorage.removeItem(LS); done=JSON.parse(localStorage.getItem(LS)||"{}"); }catch(_){}
const mark=k=>{ done[k]=1; try{ localStorage.setItem(LS,JSON.stringify(done)); }catch(_){} };
const preview=(location.search.match(/[?&]popnow=([0-9T:\-]+)/)||[])[1];
const startedAt=Date.now();
function pnow(){
  if(preview){ const t=new Date(new Date(preview+":00Z").getTime()+(Date.now()-startedAt));
    const iso=t.toISOString(); return {date:iso.slice(0,10),time:iso.slice(11,16)}; }
  return bcnNow();
}
const mins=t=>{ const [h,m]=t.split(":").map(Number); return h*60+m; };
const prevDate=d=>{ const t=new Date(d+"T12:00:00Z"); t.setUTCDate(t.getUTCDate()-1); return t.toISOString().slice(0,10); };
const find=(d,m)=>(S[d]||[]).find(x=>x.title.toLowerCase().includes(m.toLowerCase()));
const anchor=(d,x)=>`#jan-${+d.slice(8)}-${S[d].indexOf(x)}`;
const vName=x=>x.v&&V[x.v]?V[x.v].n.split(" — ")[0]:"";
const route=x=>{ const v=x.v&&V[x.v]; return v&&v.a&&!v.home?`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(v.a)}&travelmode=transit`:""; };
const dayLbl=d=>fmt(d,{weekday:"short",month:"short",day:"numeric"});

// Each check returns a pop-up {k, c(colour var), kicker, title, body, btns} or null
function cWelcome(n){
  if(n.date<"2027-01-07"||n.date>"2027-01-08") return null;
  return {k:"welcome",c:"--c-social",kicker:"Arrival day",title:POP.welcome.title,
    body:"<ul>"+POP.welcome.lines.filter(Boolean).map(l=>`<li>${l}</li>`).join("")+"</ul>",
    btns:[["Group WhatsApp",typeof WHATSAPP_GROUP!=="undefined"?WHATSAPP_GROUP:""]]};
}
function cChanges(){
  const list=[]; for(const d of dates) for(const x of S[d]){ const s=freshState(d,x); if(s) list.push([d,x,s]); }
  if(!list.length) return null;
  const k="chg:"+list.map(([d,x])=>evKey(d,x)+sig(x)).join(";");
  return {k,c:"--c-talk",kicker:"Schedule updated",title:list.length===1?"1 change since you last looked":`${list.length} changes since you last looked`,
    body:"<ul>"+list.slice(0,8).map(([d,x,s])=>`<li><a href="${anchor(d,x)}" data-close>${dayLbl(d)} · ${x.s?t12(x.s)+" · ":""}${x.title}</a> <small class="pp-m">(${s})</small></li>`).join("")+"</ul>"+(list.length>8?`<p class="pp-m">…and ${list.length-8} more, marked on each day.</p>`:"")};
}
function cDeparture(n){
  for(const [g,cfg] of [["core",POP.departure.core],["ext",POP.departure.ext]]){
    const on = n.date===cfg.d && mins(n.time)<mins("12:00");
    const eve = n.date===prevDate(cfg.d) && mins(n.time)>=mins("18:00");
    if(!on&&!eve) continue;
    return {k:"dep:"+g,c:"--c-travel",kicker:g==="core"?"Departure · core group":"Departure · extension group",
      title:on?"Travel day checklist":"Tomorrow you fly home",
      body:(cfg.note?`<p class="pp-m">${cfg.note}</p>`:"")+"<ul>"+POP.departure.items.filter(Boolean).map((t,i)=>`<li class="ck"><input type="checkbox" id="ppck${i}"><label for="ppck${i}">${t}</label></li>`).join("")+"</ul>"};
  }
  return null;
}
function cShow(n){
  for(const s of POP.shows){ if(s.d!==n.date) continue; const x=find(s.d,s.match); if(!x||!x.s) continue;
    const left=mins(x.s)-mins(n.time); if(left<0||left>POP.showMinutes) continue;
    return {k:"show:"+s.d+s.match,c:"--c-perf",kicker:"Tonight",title:x.title,
      body:`<p><b>${t12(x.s)}</b>${vName(x)?" · "+vName(x):""}</p>`+(s.meet?`<p>📍 <b>Meet:</b> ${s.meet}</p>`:"")+(s.note?`<p>${s.note}</p>`:""),
      btns:[["Route",route(x)]]};
  }
  return null;
}
function cNextUp(n){
  const its=(S[n.date]||[]).filter(x=>x.s).sort((a,b)=>a.s.localeCompare(b.s));
  for(let i=0;i<its.length;i++){ const x=its[i]; if(!x.v||x.t==="perf") continue;
    const prev=its[i-1]; if(prev&&prev.v===x.v) continue;           // same place as before: no pop-up
    const left=mins(x.s)-mins(n.time); if(left<0||left>POP.nextUpMinutes) continue;
    const b=POP.bring.find(b=>b.d===n.date&&b.text&&x.title.toLowerCase().includes(b.match.toLowerCase()));
    return {k:"nx:"+n.date+x.s,c:"--c-guest",kicker:`Next up · in ${left} min`,title:x.title,
      body:`<p><b>${t12(x.s)}</b>${vName(x)?" · "+vName(x):""}</p>`+(x.who?`<p class="pp-m">${x.who}</p>`:"")+(b?`<p>🎒 ${b.text}</p>`:""),
      btns:[["Route",route(x)]]};
  }
  return null;
}
function cBring(n){
  for(const b of POP.bring){ if(!b.text) continue; const x=find(b.d,b.match); if(!x) continue;
    const eve=n.date===prevDate(b.d)&&mins(n.time)>=mins(POP.bringFrom);
    const morn=n.date===b.d&&x.s&&mins(n.time)<mins(x.s)-POP.nextUpMinutes;
    if(!eve&&!morn) continue;
    return {k:"br:"+b.d+b.match,c:"--c-studio",kicker:eve?"For tomorrow":"For today",title:"What to bring",
      body:`<p><b>${x.title}</b><br><span class="pp-m">${dayLbl(b.d)}${x.s?" · "+t12(x.s):""}${vName(x)?" · "+vName(x):""}</span></p><p>🎒 ${b.text}</p>`};
  }
  return null;
}

const CHECKS=[cWelcome,cChanges,cDeparture,cShow,cNextUp,cBring];
let open=false;
function next(){
  if(open) return; const n=pnow();
  for(const f of CHECKS){ const p=f(n); if(p&&!done[p.k]) return show(p); }
}
function show(p){
  open=true;
  const btns=(p.btns||[]).filter(b=>b[1]).map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${l} →</a>`).join("");
  const el=document.createElement("div"); el.id="pp"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  el.innerHTML=`<div class="pp-c" style="--pc:var(${p.c})"><small class="k">${p.kicker}</small><h3>${p.title}</h3>${p.body}<div class="pp-b">${btns}<button class="pri">Got it</button></div><div class="pp-hint">Tap anywhere to close</div></div>`;
  let closing=false;
  const close=(x,y)=>{ if(closing) return; closing=true; mark(p.k);
    const c=el.querySelector(".pp-c"), r=c.getBoundingClientRect();
    c.style.transformOrigin=`${x-r.left}px ${y-r.top+c.scrollTop}px`;   // implode towards the tap
    el.classList.add("out");
    setTimeout(()=>{ el.remove(); open=false; setTimeout(next,600); },460); };
  el.addEventListener("click",e=>{
    if(e.target.closest("input,label")) return;                       // ticking the departure checklist keeps it open
    close(e.clientX||innerWidth/2, e.clientY||innerHeight/2); });
  document.body.appendChild(el);
}
setTimeout(next,2400);                 // after the splash
setInterval(next,60*1000);             // keep checking while the app is open
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) setTimeout(next,800); });
})();
</script>
