<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interdisciplinary January&#39;27</title>
<meta name="application-name" content="INTER">
<meta name="apple-mobile-web-app-title" content="INTER">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d4442a">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Oswald:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1b1b1b; --muted:#6b6862; --line:#e4e0d8;
    --accent:#d4442a; --accent-soft:#fbe9e5;
    --c-studio:#2f6fdb; --c-guest:#c2398a; --c-outing:#e07b1a; --c-perf:#7b4bd1;
    --c-talk:#b38a00; --c-show:#d4442a; --c-social:#2e8b57; --c-free:#8a8780; --c-creation:#0f8b8d; --c-travel:#4b5563;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141413; --card:#1f1f1d; --ink:#f2f0ea; --muted:#a19e96; --line:#33322f; --accent-soft:#3a1f19; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0;max-width:640px;margin:0 auto}
  .brand{font-weight:700;letter-spacing:.06em;font-size:13px}
  .brand span{color:#fff;opacity:.75}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid rgba(255,255,255,.6);background:none;color:#fff;font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
  .tab.on{background:#fff;color:var(--accent);border-color:#fff;font-weight:700}
  .days{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 14px;max-width:640px;margin:0 auto;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .daysep{flex:0 0 2px;align-self:stretch;margin:4px 2px;background:rgba(255,255,255,.55);border-radius:2px}
  .day.out{cursor:pointer}
  header.nodays .top{padding-bottom:12px}
  .day{flex:0 0 auto;border:1px solid transparent;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;font:inherit;min-width:52px}
  .day small{display:block;font-size:11px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.05em}
  .day b{font-size:17px}
  .day.on{border:2px solid #fff;padding:5px 9px;box-shadow:inset 0 0 12px 3px rgba(255,255,255,.75)}
  .day.today{border:2px solid #ffd84a;padding:5px 9px;animation:todayPulse 2.4s ease-in-out infinite}
  @keyframes todayPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,60,0)}50%{box-shadow:0 0 14px 5px rgba(255,210,60,1)}}
  .day.ext small{color:#fff}
  main{max-width:640px;margin:0 auto;padding:14px 16px 60px}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
  .ev{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--c,var(--c-free))}
  .ev.hit,.artist.hit{animation:hit 6s ease-in-out 1}
  @keyframes hit{0%,100%{box-shadow:0 0 0 0 rgba(123,75,209,0)}17%{box-shadow:0 0 22px 8px rgba(123,75,209,.7)}}
  .ev.now{outline:2px solid var(--accent)}
  .time{flex:0 0 64px;font-weight:700;font-size:15px;line-height:1.25}
  .time small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  .body{flex:1;min-width:0}
  .title{font-weight:700;font-size:16px;line-height:1.3}
  .who{font-size:14px;color:var(--muted);margin-top:2px}
  .where{font-size:14px;margin-top:6px}
  .tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--muted)}
  .tag.tbc{background:#fff4d6;color:#8a6200}
  .tag.opt{background:#e6f4ec;color:#1f6b42}
  .tag.ext{background:#e3ecfb;color:#1f4fa6}
  .tag.now{background:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .tag.tbc{background:#3a3016;color:#f0c75e} .tag.opt{background:#17301f;color:#7fd3a1} .tag.ext{background:#192640;color:#8fb3f2} }
  .map{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:4px 11px}
  :root{--link:#7b4bd1;--link-soft:#ffffff}
  @media (prefers-color-scheme: dark){ :root{--link:#b49bf2;--link-soft:var(--card)} }
  .alink{display:inline-block;margin:8px 6px 0 0;font-size:13px;font-weight:700;color:var(--link);background:var(--link-soft);text-decoration:none;border:1px solid var(--link);border-radius:999px;padding:4px 11px}
  .fold{margin:22px 0 10px}
  .fold summary{list-style:none;cursor:pointer;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary::after{content:"▾";color:var(--link,#7b4bd1);font-size:18px;transition:transform .25s}
  .fold[open] summary::after{transform:rotate(180deg)}
  .fold[open] summary{border-radius:14px 14px 0 0;border-bottom:none;margin-bottom:0}
  .fold[open] .card{border-radius:0 0 14px 14px;border-top:none;padding-top:4px;animation:unfold .25s ease}
  @keyframes unfold{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .slide-l{animation:slideL .25s ease}
  .slide-r{animation:slideR .25s ease}
  @keyframes slideL{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
  @keyframes slideR{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
  .lunch{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:4px 2px 14px}
  .lunch::before,.lunch::after{content:"";flex:1;border-top:1px dashed var(--line)}
  .ov{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
  .ov.we{border-left:4px solid var(--we-ink)}
  .note.ovglow{border:1px solid #f5c518;box-shadow:0 0 14px 4px rgba(240,190,30,.85)}
  .artist.now,.venue.now{border-color:#f5c518;box-shadow:0 0 14px 4px rgba(240,190,30,.85);position:relative}
  .todaytag{position:absolute;top:10px;right:10px;z-index:2}
  .ov.today{border-color:#f5c518;box-shadow:0 0 14px 4px rgba(240,190,30,.85)}
  .ovd{display:block;font-weight:700;font-size:15px;color:var(--ink);text-decoration:none;margin-bottom:4px}
  .ovr{display:flex;gap:10px;font-size:14px;color:var(--ink);text-decoration:none;padding:3px 0;border-top:1px solid var(--line)}
  .ovr small{color:var(--muted)}
  .ovt{flex:0 0 72px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
  .cdbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:6px 0 14px;text-align:center}
  .cdbox{cursor:pointer;-webkit-tap-highlight-color:transparent}
  .flicker{position:fixed;inset:0;z-index:40;pointer-events:none;background:rgba(10,8,6,.86);animation:dimIn .35s ease both}
  @keyframes dimIn{from{opacity:0}to{opacity:1}}
  .cdbox.lit{box-shadow:0 0 40px 6px rgba(212,175,55,.45);transition:box-shadow .35s ease}
  .cdhint{margin-top:10px;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .cdl{font-weight:700;font-size:15px;margin-bottom:12px}
  .cdg{display:flex;justify-content:center;align-items:flex-start;gap:6px}
  .cdu.cdays{margin-right:14px}
  .colon{font-family:"Oswald","Arial Narrow",sans-serif;font-size:30px;font-weight:500;line-height:40px;padding-top:6px;color:#b8922a;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  .cdg small{color:var(--muted);font-size:12px}
  #totop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:7;display:block;opacity:0;transform:translateY(70px);pointer-events:none;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s ease;font:inherit;font-size:13px;font-weight:700;color:#fff;background:rgba(123,75,209,.5);border:1px solid #fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #totop.show{opacity:1;transform:none;pointer-events:auto}
  #totop.show:active{transform:scale(.92)}
  /* fun bits */
  .cdu{padding:6px 0 0}
  .flaps{display:flex;justify-content:center;gap:3px;margin-bottom:6px;perspective:300px}
  .flap{position:relative;display:inline-block;width:26px;height:40px;font-family:"Oswald","Arial Narrow",sans-serif;font-weight:500;font-size:30px;color:#1b1b1b;border-radius:4px;box-shadow:0 2px 3px rgba(0,0,0,.3);perspective:160px;font-variant-numeric:tabular-nums}
  .flap .h{position:absolute;left:0;right:0;height:50%;overflow:hidden}
  .flap .h span{position:absolute;left:0;right:0;height:40px;line-height:40px;text-align:center}
  .flap .t{top:0;border-radius:4px 4px 0 0;background:linear-gradient(#e9cb6b,#dcb94f)}
  .flap .b{bottom:0;border-radius:0 0 4px 4px;background:linear-gradient(#cfa83a,#c39b2e)}
  .flap .t span{top:0}
  .flap .b span{bottom:0}
  .flap .ft{z-index:2;transform-origin:bottom;animation:foldTop .22s ease-in forwards;backface-visibility:hidden}
  .flap .fb{z-index:2;transform-origin:top;transform:rotateX(90deg);animation:foldBot .22s .22s ease-out forwards;backface-visibility:hidden}
  @keyframes foldTop{to{transform:rotateX(-90deg);filter:brightness(.7)}}
  @keyframes foldBot{from{transform:rotateX(90deg);filter:brightness(1.2)}to{transform:rotateX(0);filter:none}}
  .flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.45);z-index:3}
  @media (prefers-color-scheme: dark){ .flap{box-shadow:0 2px 4px rgba(0,0,0,.6)} }
  .flip{animation:flip .45s ease}
  @keyframes flip{0%{transform:rotateX(90deg);opacity:.2}100%{transform:rotateX(0);opacity:1}}
  .confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
  #main{overflow-x:clip;min-height:100vh}
  .reveal{opacity:0;transform:translateY(18px)}
  .reveal.in{animation:rise .5s ease both;animation-delay:var(--d,0ms)}
  .artist.reveal.in,.venue.reveal.in,.info .reveal.in{animation:riseFade 1s cubic-bezier(.25,.6,.3,1) both;animation-delay:var(--d,0ms)}
  @keyframes riseFade{0%{opacity:0;transform:translateY(36px) scale(.98)}100%{opacity:1;transform:none}}
  .reveal-x{opacity:0;transform:translateX(28px)}
  .reveal-x.in{animation:slideIn .45s ease both;animation-delay:var(--d,0ms)}
  @keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  .reveal.hit,.reveal.in.hit{opacity:1;transform:none;animation:hit 6s ease-in-out 1}
  .big.sos{animation:sos 1.4s ease 1}
  @keyframes sos{0%{text-shadow:none;transform:scale(1)}30%{text-shadow:0 0 18px rgba(212,68,42,.9);transform:scale(1.15)}100%{text-shadow:none;transform:scale(1)}}
  .info .big{display:block;width:fit-content;margin-bottom:8px;transform-origin:left center}
  .ev.rise.hit{animation:hit 6s ease-in-out 1}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .tag.now::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:5px;vertical-align:1px;animation:live 1.2s ease-in-out infinite}
  @keyframes live{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
  .day,.tab,.alink,.map,.links a,.phone a,.nbi a,.ovr{transition:transform .12s ease}
  .day:active,.tab:active,.alink:active,.map:active,.links a:active,.phone a:active,.nbi a:active,.ovr:active{transform:scale(.92)}
  @media (prefers-reduced-motion: reduce){ .reveal,.reveal-x{opacity:1!important;transform:none!important} .flip,.reveal.in,.reveal-x.in,.big.sos,.tag.now::before{animation:none!important} }
  .tag.tt{background:color-mix(in srgb, var(--c) 15%, transparent);color:var(--c);text-transform:none;letter-spacing:0;font-size:12px;border-radius:999px;padding:2px 9px}
  .tag.upd{background:#7b4bd1;color:#fff;text-transform:none;letter-spacing:0;font-size:12px;border-radius:999px;padding:2px 9px}
  .day{position:relative}
  .updot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #7b4bd1}
  .nextup{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:4px solid #f5c518;border-radius:14px;padding:10px 14px;margin:0 0 14px}
  .nextup small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#b38a00}
  .nextup b{display:block;font-size:15px}
  .nextup span{font-size:13px;color:var(--muted)}
  #help{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;transition:transform .45s cubic-bezier(.3,1.1,.5,1),opacity .35s ease}
  #help summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:#fff;background:rgba(37,163,90,.5);border:1px solid #fff;border-radius:999px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #help summary::-webkit-details-marker{display:none}
  #help.gone{transform:translateY(-60px);opacity:0;pointer-events:none}
  .helpbox{position:absolute;right:0;bottom:46px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px;min-width:200px;animation:rise .2s ease}
  .helpbox a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px}
  .helpbox a small{font-weight:400;color:var(--muted);font-size:12px}
  .helpbox a:active{background:var(--bg)}
  .helpbox a.sos{color:#d4442a;border-top:1px solid var(--line);border-radius:0 0 10px 10px}
  .walk{display:inline-block;margin-left:6px;font-size:12px;font-weight:500;color:var(--muted)}
  a.card.sosc{display:block;color:var(--ink);text-decoration:none;border-color:#d4442a;transition:transform .12s ease}
  a.card.sosc:active{transform:scale(.97)}
  .callme{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:#d4442a}
  #splash{position:fixed;inset:0;z-index:100;background:var(--accent);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease .1s}
  #splash .sp-in{text-align:center;animation:splashIn .5s ease both}
  #splash .sp-w{color:#fff;font-size:18px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-bottom:10px}
  #splash img{width:min(70vw,320px);height:auto;display:block;transition:transform .7s cubic-bezier(.5,0,.2,1)}
  #splash .sp-w{transition:opacity .3s ease}
  #splash.out .sp-w{opacity:0}
  #splash.out{opacity:0}
  @keyframes splashIn{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
  .ripple{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:90;border:2px solid rgba(123,75,209,.55);background:radial-gradient(circle,rgba(123,75,209,.18),rgba(123,75,209,0) 70%);transform:scale(0);opacity:0;animation:ripple .8s cubic-bezier(.2,.6,.3,1) forwards}
  .ripple.white,.ripple.white{border-color:rgba(255,255,255,.85);background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,0) 70%)}
  @keyframes ripple{0%{transform:scale(0);opacity:.9}100%{transform:scale(var(--rs,7));opacity:0}}
  @media (prefers-color-scheme: dark){ .ripple{border-color:rgba(200,180,255,.55);background:radial-gradient(circle,rgba(200,180,255,.18),rgba(200,180,255,0) 70%)} }
  .note{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .info h2{font-size:16px;margin:22px 0 8px}
  .info .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:15px;line-height:1.5}
  .info .big{font-size:26px;font-weight:700;color:var(--accent)}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  .tabs{flex-wrap:wrap;justify-content:center;width:100%}
  .top{justify-content:center}
  html,body{overscroll-behavior-y:none}
  .logoband{background:var(--accent);text-align:center;padding:22px 16px 6px}
  .logoband .lb-sub{color:#fff;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.9;margin-top:8px}
  .logoband img{display:block;width:min(340px,80%);height:auto;margin:0 auto}
  .artist{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
  .artist .pic{aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;color:#fff;letter-spacing:.02em;background:var(--c)}
  .artist .pic img{width:100%;height:100%;object-fit:cover}
  .artist .in{padding:14px 16px 16px}
  .artist h3{margin:0;font-size:19px}
  .artist .role{color:var(--muted);font-size:14px;margin-top:2px}
  .artist p{font-size:15px;line-height:1.5;margin:10px 0 0}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .links a{font-size:13px;font-weight:700;color:var(--link,#7b4bd1);background:var(--link-soft,#fff);text-decoration:none;border:1px solid var(--link,#7b4bd1);border-radius:999px;padding:5px 12px}
  .links a.mapl{color:var(--accent);background:transparent;border-color:var(--accent)}
  .sess{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .sess a{font-size:14px;color:var(--accent);text-decoration:none;font-weight:500}
  .top{flex-wrap:wrap;row-gap:8px}
  .time{flex-basis:76px}
  /* Weekend days */
  :root{--we:#fff1c9;--we-ink:#8a5a00}
  @media (prefers-color-scheme: dark){ :root{--we:#3a2f14;--we-ink:#f0c75e} }
  .day.we{background:rgba(0,0,0,.22);border-color:transparent}
  .day.we small{color:#fff;font-weight:700}
  .day.we.today{border-color:#ffd84a}
  .day.we.on{border-color:#fff}
  .day.today.on{border-color:#fff;animation:todayPulseOn 2.4s ease-in-out infinite}
  @keyframes todayPulseOn{0%,100%{box-shadow:inset 0 0 12px 3px rgba(255,255,255,.75)}50%{box-shadow:inset 0 0 12px 3px rgba(255,255,255,.75),0 0 0 3px #ffd84a,0 0 18px 7px rgba(255,210,60,1)}}
  .tag.we{background:var(--we);color:var(--we-ink)}
  /* Venues + contacts */
  .venue{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .venue h3{margin:0;font-size:18px}
  .venue{overflow:hidden}
  .venue .vpic{display:block;width:calc(100% + 32px);margin:-14px -16px 12px;aspect-ratio:9/5;object-fit:cover}
  .venue p{font-size:15px;line-height:1.5;margin:6px 0 0}
  .venue .addr{font-size:14px;color:var(--muted);margin-top:6px}
  .phone{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .phone:first-of-type{border-top:none}
  .phone .num{font-size:18px;font-weight:700;letter-spacing:.02em}
  .phone a{font-size:13px;font-weight:700;color:var(--link);background:var(--link-soft);text-decoration:none;border:1px solid var(--link);border-radius:999px;padding:4px 11px;white-space:nowrap}
  .mapbox{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;-webkit-overflow-scrolling:touch}
  .mapbox img{display:block;width:100%}

// Current date/time in Barcelona
function bcnNow(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Madrid",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})
    .formatToParts(new Date()).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return {date:`${p.year}-${p.month}-${p.day}`, time:`${p.hour==="24"?"00":p.hour}:${p.minute}`};
}
const now = bcnNow();
const todayInProgram = dates.includes(now.date);

let view = "schedule";

function dayFromHash(){
  const m = location.hash.match(/^#jan-(\d{1,2})(?:-\d+)?$/);
  if(m){ const d = `2027-01-${m[1].padStart(2,"0")}`; if(S[d]) return d; }
  if(location.hash==="#info") return "info";
  if(location.hash==="#overview") return "overview";
  if(location.hash==="#today") return outside() ? "today" : now.date;
  if(location.hash==="#artists"||location.hash.startsWith("#artist-")) return "artists";
  if(location.hash==="#venues") return "venues";
  if(location.hash==="#nearby") return "nearby";
  return null;
}

// "13:30" → "1:30 PM"
function t12(hm){
  if(!hm) return "";
  let [h,m] = hm.split(":").map(Number);
  const ap = h>=12 ? "PM" : "AM";
  h = h%12 || 12;
  return `${h}${m?":"+String(m).padStart(2,"0"):""} ${ap}`;
}
const isWeekend = d => [0,6].includes(new Date(d+"T12:00:00").getDay());

function closestDay(){
  const t = new Date(now.date+"T12:00:00");
  return dates.reduce((best,d)=>Math.abs(new Date(d+"T12:00:00")-t) < Math.abs(new Date(best+"T12:00:00")-t) ? d : best, dates[0]);
}

function outside(){ return now.date<dates[0] || now.date>dates[dates.length-1]; }
// Live countdown to 00:00 on the first day, Barcelona time (CET, UTC+1 in January)
const START = new Date(dates[0]+"T00:00:00+01:00");
function cdParts(){
  let s = Math.max(0, Math.floor((START - Date.now())/1000));
  const d=Math.floor(s/86400); s%=86400; const hh=Math.floor(s/3600); s%=3600; const mm=Math.floor(s/60); s%=60;
  return {d,hh,mm,ss:s};
}
function cdText(){ const p=cdParts(); return `${p.d} days · ${p.hh} h · ${p.mm} min · ${p.ss} s`; }
function countdownText(){
  const last=dates[dates.length-1];
  const gap=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
  if(now.date<dates[0]) return `<b><span class="cd">${cdText()}</span> to go</b><br>`;
  if(now.date>last){ const n=gap(last,now.date); return `<b>${n} ${n===1?"day":"days"} since the program</b><br>`; }
  return "";
}
function renderToday(){
  let html = `<h1>${fmt(now.date,{weekday:"long",month:"long",day:"numeric"})}</h1><p class="sub">Today</p>`;
  if(now.date<dates[0]){
    const p=cdParts();
    html += `<div class="cdbox"><div class="cdl">Countdown to ${fmt(dates[0],{weekday:"short",month:"short",day:"numeric"})}</div>
      <div class="cdg">${[["d","days"],["hh","hours"],["mm","min"],["ss","sec"]].map(([k,l],i)=>(i>1?`<div class="colon">:</div>`:"")+`<div class="cdu${i===0?" cdays":""}"><div class="flaps" data-k="${k}">${flapHTML(p[k])}</div><small>${l}</small></div>`).join("")}</div><div class="cdhint">Tap the board</div></div>
      <p class="sub" style="text-align:center">Swipe left or tap a date to see the program.</p>`;
  } else {
    html += `<div class="cdbox"><div class="cdl">The program has ended. Thank you for being part of it!</div></div>`;
  }
  return html;
}
setInterval(()=>{
  if(!(now.date<dates[0])) return;
  const p=cdParts();
  document.querySelectorAll(".cd").forEach(e=>e.textContent=cdText());
  if(!shuffling) document.querySelectorAll(".flaps").forEach(box=>{
    const s=String(p[box.dataset.k]).padStart(2,"0"), tiles=box.querySelectorAll(".flap");
    if(tiles.length!==s.length){ box.innerHTML=flapHTML(p[box.dataset.k]); return; }
    tiles.forEach((t,i)=>{ if(t.dataset.v!==s[i]) setFlap(t,s[i]); });
  });
  if(START-Date.now()<=10000 && !zeroFired && document.querySelector(".cdbox")){ zeroFired=true; confetti(); }
},1000);
let zeroFired=false;

const flapStatic = c => `<div class="h t"><span>${c}</span></div><div class="h b"><span>${c}</span></div>`;
// Tap the countdown: the whole board shuffles like a departures board, then lands on the real time
let shuffling=false;
document.addEventListener("click",e=>{
  if(!e.target.closest(".cdbox") || shuffling) return;
  shuffling=true;
  if(!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)){
    const fx=document.createElement("div"); fx.className="flicker"; document.body.appendChild(fx);
    const box=document.querySelector(".cdbox"); if(box) box.classList.add("lit");
    const hole=()=>{ if(!box) return; const b=box.getBoundingClientRect(), W=innerWidth, H=innerHeight, rr=16;
      const x=b.left,y=b.top,w=b.width,hh=b.height;
      const d=`M0 0H${W}V${H}H0Z M${x+rr} ${y}H${x+w-rr}A${rr} ${rr} 0 0 1 ${x+w} ${y+rr}V${y+hh-rr}A${rr} ${rr} 0 0 1 ${x+w-rr} ${y+hh}H${x+rr}A${rr} ${rr} 0 0 1 ${x} ${y+hh-rr}V${y+rr}A${rr} ${rr} 0 0 1 ${x+rr} ${y}Z`;
      fx.style.clipPath=`path(evenodd, "${d}")`; fx.style.webkitClipPath=`path(evenodd, "${d}")`; };
    hole(); addEventListener("scroll",hole,{passive:true}); addEventListener("resize",hole);
    setTimeout(()=>{ removeEventListener("scroll",hole); removeEventListener("resize",hole); }, 7*230+1900);
    const fadeMs=7*230+900;
    setTimeout(()=>{ const o=getComputedStyle(fx).opacity; fx.style.animation="none"; fx.style.opacity=o; void fx.offsetWidth;
      fx.style.transition=`opacity ${fadeMs}ms cubic-bezier(.4,0,.2,1)`; fx.style.opacity="0";
      if(box){ box.style.transition=`box-shadow ${fadeMs}ms ease`; box.classList.remove("lit"); }
      setTimeout(()=>{ fx.remove(); if(box) box.style.transition=""; },fadeMs+50); }, 900);
  }
  haptic([10,40,10,40,10]); if(!navigator.vibrate) [130,260].forEach(t=>setTimeout(()=>haptic(),t));
  const tiles=[...document.querySelectorAll(".cdbox .flap")];
  const STEP=110, FIRST=900, GAP=230;
  const real=t=>{ const box=t.closest(".flaps"), p=cdParts(), s=String(p[box.dataset.k]).padStart(2,"0"); return s[[...box.querySelectorAll(".flap")].indexOf(t)]; };
  tiles.forEach((t,i)=>{
    const stop=FIRST+i*GAP;
    // flips start fast and slow down as the tile approaches its landing
    const times=[]; let ms=stop, step=260; while(ms>i*30+STEP){ ms-=step; times.push(ms); step=Math.max(STEP*0.8, step*0.78); }
    times.forEach(tm=>setTimeout(()=>setFlap(t,String(Math.floor(Math.random()*10))), tm));
    setTimeout(()=>setFlap(t,real(t)), stop);   // this tile lands, then the next one
  });
  const longest=FIRST+(tiles.length-1)*GAP+500;
  setTimeout(()=>{ shuffling=false; }, longest);
});
function flapHTML(n){ return String(n).padStart(2,"0").split("").map(c=>`<span class="flap" data-v="${c}">${flapStatic(c)}</span>`).join(""); }
// Split-flap: the top half of the old digit folds down onto the new bottom half
function setFlap(t,nv){
  const ov=t.dataset.v; t.dataset.v=nv;
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ t.innerHTML=flapStatic(nv); return; }
  t.innerHTML=`<div class="h t"><span>${nv}</span></div><div class="h b"><span>${ov}</span></div><div class="h t ft"><span>${ov}</span></div><div class="h b fb"><span>${nv}</span></div>`;
  clearTimeout(t._tm); t._tm=setTimeout(()=>{ if(t.dataset.v===nv) t.innerHTML=flapStatic(nv); },480);
}

// Lightweight confetti burst
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.createElement("canvas"); c.className="confetti"; document.body.appendChild(c);
  const x=c.getContext("2d"), W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio;
  const cols=["#d4442a","#f5c518","#7b4bd1","#ffffff","#2e8b57","#ff8fb1"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*W*.02,vy:-Math.random()*H*.022-H*.006,s:(6+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0]}));
  let t=0; (function f(){ t++; x.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy+=H*.0006; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.globalAlpha=Math.max(0,1-t/170); x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(t<170) requestAnimationFrame(f); else c.remove(); })();
}

let navInit=false;
function renderDays(){
  const nav = document.getElementById("days");
  const showBar = view==="schedule"||view==="today";
  nav.style.display = showBar ? "flex" : "none";
  document.querySelector("header").classList.toggle("nodays", !showBar);
  let html = dates.map(d=>{
    const cls = ["day", (view==="schedule"&&d===current)?"on":"", d===now.date?"today":"", extOnly(d)?"ext":"", isWeekend(d)?"we":""].join(" ");
    return `<button class="${cls}" data-d="${d}">${dayFresh(d)?'<i class="updot"></i>':''}<small>${fmt(d,{weekday:"short"})}</small><b>${+d.slice(8)}</b></button>`;
  }).join("");
  // Outside the program: a "today" chip before or after the dates, with a bar if not contiguous
  const first=dates[0], last=dates[dates.length-1];
  const gap=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
  if(now.date<first || now.date>last){
    const before = now.date<first, n = before ? gap(now.date,first) : gap(last,now.date);
    const chip = `<div class="day today out${view==="today"?" on":""}" title="Today"><small>${fmt(now.date,{month:"short"})}</small><b>${+now.date.slice(8)}</b></div>`;
    const sep = n>1 ? `<span class="daysep"></span>` : "";
    html = before ? chip+sep+html : html+sep+chip;
  }
  const keepX = nav.scrollLeft;
  nav.innerHTML = html;
  nav.scrollLeft = keepX;
  const tc = nav.querySelector(".day.out"); if(tc) tc.onclick=()=>{ location.hash="today"; };
  nav.querySelectorAll(".day[data-d]").forEach(b=>b.onclick=()=>{location.hash="jan-"+(+b.dataset.d.slice(8));});
  const on = nav.querySelector(".on");
  if(on){ // only scroll if the selected date is off-screen; centre it just on first load
    const nr=nav.getBoundingClientRect(), br=on.getBoundingClientRect();
    if(!navInit){ nav.scrollLeft += (br.left+br.width/2) - (nr.left+nr.width/2); navInit=true; }
    else if(br.left<nr.left+8) nav.scrollLeft -= (nr.left+8-br.left);
    else if(br.right>nr.right-8) nav.scrollLeft += (br.right-(nr.right-8));
  }
}

// Street part of the address: drop the leading venue name and the city
function street(v){
  const parts = v.a.split(", ").filter(p=>p!=="Barcelona");
  if(parts.length>1 && /[A-Za-zÀ-ÿ]/.test(parts[0]) && !/^(C\/|Pg\.|Pl\.|Plaça|La Rambla|Rambla)/.test(parts[0])) parts.shift();
  return parts.join(", ");
}

function slug(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function artistChips(name){

const toM = t=>t?(+t.slice(0,2))*60+(+t.slice(3)):null;
// Lunch (gap starting 11:30–15:00) and dinner (gap starting 17:00+, next thing at 7 PM or later), at least 45 min
function breaksFor(items){
  const out = {}; let maxEnd = null, lunch=false, dinner=false;
  for(let i=0;i<items.length-1;i++){
    const a=items[i]; if(a.e){ const m=toM(a.e); if(maxEnd===null||m>maxEnd[0]) maxEnd=[m,a.e]; }
    const b=items[i+1]; if(!maxEnd||!b.s) continue;
    const g0=maxEnd[0], g1=toM(b.s); if(g1-g0<45) continue;
    if(!lunch && g0>=690 && g0<=900){ out[i]=`🥪 Lunch break · ${t12(maxEnd[1])} – ${t12(b.s)}`; lunch=true; }
    else if(!dinner && g0>=1020 && g1>=1080 && b.t!=="free"){ out[i]=`🍝 Dinner break · ${t12(maxEnd[1])} – ${t12(b.s)}`; dinner=true; }
  }
  return out;
}

function ovNote(){
  const first=dates[0], last=dates[dates.length-1];
  const days = (a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
  const today = fmt(now.date,{weekday:"short",month:"short",day:"numeric"});
  if(now.date<first){ const n=days(now.date,first); return `<div class="note ovglow">Today is ${today}. The program starts in <b>${n} day${n===1?"":"s"}</b>.</div>`; }
  if(now.date>last) return `<div class="note ovglow">Today is ${today}. The program has ended.</div>`;
  return "";
}

// ---- Next up (during the program, on today's page)
function nextUp(){
  const its=(S[now.date]||[]).filter(x=>x.s).sort((a,b)=>a.s.localeCompare(b.s));
  const cur=its.find(x=>x.e && now.time>=x.s && now.time<x.e);
  const nx=its.find(x=>x.s>now.time);
  const show=(x,lbl)=>{ const v=x.v?V[x.v]:null;
    const dir=v&&v.a?`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(V.yugo.a)}&destination=${encodeURIComponent(v.a)}&travelmode=transit`:"";
    return `<div class="nextup"><div><small>${lbl}</small><b>${x.title}</b><span>${t12(x.s)}${v?` · ${v.n.split(" — ")[0]}`:""}</span></div>${dir?`<a class="map" style="margin:0" href="${dir}" target="_blank" rel="noopener">Route →</a>`:""}</div>`; };
  if(nx) return show(nx, cur?"Next, after this":"Next up");

}

// ---- "Updated" tags: compare each session with what this phone saw before
const SEEN_KEY="inter27-seen";
let seen={}, seenInit=false;
try{ const raw=localStorage.getItem(SEEN_KEY); if(raw){ seen=JSON.parse(raw); seenInit=true; } }catch(_){}
const sig=x=>[x.s,x.e,x.v||"",(x.vs||[]).join(","),x.who||"",x.tbc?1:0].join("|");
const evKey=(d,x)=>d+"|"+x.title;
const FRESH=24*3600e3;
(function diffAll(){
  const t=Date.now(), next={};
  for(const d of dates) for(const x of S[d]){
    const k=evKey(d,x), s=sig(x), old=seen[k];
    if(!seenInit) next[k]={h:s,t:0};
    else if(!old) next[k]={h:s,t,n:1};
    else if(old.h!==s) next[k]={h:s,t,u:1};
    else next[k]=old;
  }
  seen=next; try{ localStorage.setItem(SEEN_KEY,JSON.stringify(seen)); }catch(_){}
})();
function freshState(d,x){ const e=seen[evKey(d,x)]; if(!e||!e.t||Date.now()-e.t>FRESH) return ""; return e.u?"Updated":e.n?"New":""; }
function updTag(d,x){ const s=freshState(d,x); return s?`<span class="tag upd">${s}</span>`:""; }
function dayFresh(d){ return S[d].some(x=>freshState(d,x)); }

// Cards drift in one at a time as they scroll into view
function setupReveal(){
  if(view==="info") document.querySelectorAll(".info > *:not(h1):not(.sub)").forEach(e=>e.classList.add("reveal"));
  if(view==="nearby") document.querySelectorAll(".nb h2, .nb h4").forEach(e=>e.classList.add("reveal-x"));
  const els=[...document.querySelectorAll(".reveal:not(.in),.reveal-x:not(.in)")];
  if(revealObs) revealObs.disconnect();
  if(!("IntersectionObserver" in window)){ els.forEach(e=>e.classList.add("in")); return; }
  revealObs = new IntersectionObserver(entries=>{
    let k=0;
    entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top).forEach(e=>{
      const el=e.target; el.style.setProperty("--d",(k++*80)+"ms"); el.classList.add("in"); revealObs.unobserve(el);
      const big=el.querySelector&&el.querySelector(".big"); if(big){ setTimeout(()=>big.classList.add("sos"),400+(k*80)); }
    });
  },{rootMargin:"0px 0px -8% 0px",threshold:0.08});
  els.forEach(e=>revealObs.observe(e));
}

  tapLevel = near ? Math.min(tapLevel+1, 10) : 0; lastTap={x:e.clientX,y:e.clientY,t:now};

  const onOrange=!!e.target.closest(".logoband,header");
  for(let k=0;k<rings;k++){ const d=k*140, s=document.createElement("span"); s.className="ripple"+(onOrange?" white":"");
    s.style.left=e.clientX+"px"; s.style.top=e.clientY+"px"; s.style.animationDelay=d+"ms"; s.style.animationDuration=dur+"ms"; s.style.setProperty("--rs",scale);

    }
    // Other tabs: Artists ↔ Venues ↔ Nearby ↔ Info (swipe right from Artists or All days goes back to the day)
    if(view==="overview"){ swipeDir=dir; location.hash = dir<0 ? "jan-"+(+(current||closestDay()).slice(8)) : "artists"; return; }
    const order=["overview","artists","venues","nearby","info"];
    const k=order.indexOf(view)+dir;
    if(k<0||k>=order.length) return;
    swipeDir = dir;
    location.hash = k===0 ? "jan-"+(+(current||closestDay()).slice(8)) : order[k];
  },{passive:true});
})();
render();
</script>
</body>
</html>
